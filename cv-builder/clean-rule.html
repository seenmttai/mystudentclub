<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Resume</title>
    <style>
        :root {
            --heading-blue: var(--header-bg, #0D56C4);
            --link-blue: #0000FF;
            --text: #000000;
            --page-bg: #ffffff;
            --viewer-bg: #525659;
            --font-main: "Calibri", "Carlito", "Segoe UI", Arial, sans-serif;
            --content-scale: 1.0;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body {
            background-color: var(--viewer-bg);
            font-family: var(--font-main);
            overflow-x: hidden;
            min-height: 100vh;
            width: 100vw;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #zoom-wrapper {
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            padding: 24px 0;
        }

        /* Page grows with content (min-height only, no overflow:hidden anywhere
           above the text) so shrinkContentToFit() can measure true overflow.
           transform-origin + flex-shrink:0 are both required — omitting either
           one makes the preview iframe's own flexbox shrink/re-center the page
           incorrectly (found and fixed on an earlier template). */
        .page {
            position: relative;
            width: 1000px;
            min-height: 1413.94px;
            background: var(--page-bg);
            box-shadow: 0 4px 24px rgba(0, 0, 0, .55);
            color: var(--text);
            transform-origin: top center;
            flex-shrink: 0;
            padding: calc(10px * var(--content-scale)) calc(28px * var(--content-scale)) calc(20px * var(--content-scale)) calc(28px * var(--content-scale));
        }

        /* ===== Header ===== */
        .name {
            text-align: center;
            font-weight: 700;
            font-size: calc(26.14px * var(--content-scale));
            line-height: 1.1;
            margin-top: calc(6px * var(--content-scale));
        }

        .contact {
            margin-top: calc(7.52px * var(--content-scale));
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            column-gap: calc(6px * var(--content-scale));
            row-gap: calc(4px * var(--content-scale));
            font-size: calc(16.34px * var(--content-scale));
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: calc(4px * var(--content-scale));
            white-space: nowrap;
        }

        .contact-item img {
            display: block;
            flex: 0 0 auto;
        }

        .contact-item img.ic-phone {
            width: calc(12.58px * var(--content-scale));
            height: calc(9.90px * var(--content-scale));
        }

        .contact-item img.ic-mail {
            width: calc(15.11px * var(--content-scale));
            height: calc(13.19px * var(--content-scale));
        }

        .contact-item img.ic-link {
            width: calc(14.80px * var(--content-scale));
            height: calc(11.37px * var(--content-scale));
        }

        .contact-item img.ic-home {
            width: calc(15.90px * var(--content-scale));
            height: calc(12.76px * var(--content-scale));
        }

        .contact a {
            color: var(--link-blue);
            text-decoration: underline;
        }

        .contact .sep {
            padding: 0 calc(5.23px * var(--content-scale));
            color: var(--text);
        }

        /* ===== Section heading + rule ===== */
        .section {
            margin-top: calc(18px * var(--content-scale));
        }

        .section:first-of-type {
            margin-top: calc(12px * var(--content-scale));
        }

        .sec-h {
            font-weight: 700;
            font-size: calc(17.97px * var(--content-scale));
            line-height: 1.1;
            color: var(--heading-blue);
            margin: 0;
        }

        .rule {
            height: calc(1.23px * var(--content-scale));
            background: #000000;
            margin: calc(6.70px * var(--content-scale)) 0 calc(6px * var(--content-scale)) 0;
            width: 100%;
        }

        /* ===== Summary ===== */
        .summary {
            font-size: calc(16.34px * var(--content-scale));
            line-height: 1.32;
            text-align: justify;
            text-justify: inter-word;
        }

        b {
            font-weight: 700;
        }

        /* ===== Education table ===== */
        .edu-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border-top: calc(4.08px * var(--content-scale)) solid #000;
            font-size: calc(16.34px * var(--content-scale));
        }

        .edu-table td {
            border: calc(0.82px * var(--content-scale)) solid #000000;
            font-size: calc(16.34px * var(--content-scale));
            line-height: 1.28;
            padding: calc(4px * var(--content-scale)) calc(6px * var(--content-scale));
            vertical-align: top;
            overflow-wrap: break-word;
        }

        .edu-remarks-sep {
            padding: 0 3px;
        }

        .edu-remarks-sep:empty {
            display: none;
        }

        /* ===== Experience ===== */
        .job-entry {
            margin-top: calc(10px * var(--content-scale));
        }

        .job-entry:first-child {
            margin-top: 0;
        }

        .job-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: calc(8px * var(--content-scale));
            flex-wrap: wrap;
        }

        .job-line {
            font-size: calc(16.34px * var(--content-scale));
            line-height: 1.25;
            flex: 1 1 auto;
            min-width: 0;
        }

        .job-line .intro {
            font-weight: 400;
        }

        .job-line .intro:empty {
            display: none;
        }

        .date {
            font-size: calc(16.34px * var(--content-scale));
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .subhead {
            display: none;
            margin-top: calc(7px * var(--content-scale));
            font-weight: 700;
            font-style: italic;
            font-size: calc(17.97px * var(--content-scale));
            line-height: 1.1;
            text-decoration: underline;
        }

        .subhead:not(:empty) {
            display: block;
        }

        .job-entry.is-subsection .job-title-block {
            display: none;
        }

        .job-entry.is-subsection .subhead {
            display: block;
        }

        /* ===== Bullet lists ===== */
        .bul {
            list-style: none;
            margin: calc(4px * var(--content-scale)) 0 0 0;
            padding: 0;
        }

        .bul li {
            position: relative;
            padding-left: calc(20.75px * var(--content-scale));
            margin-top: calc(3px * var(--content-scale));
            font-size: calc(16.34px * var(--content-scale));
            line-height: 1.28;
            text-align: justify;
            text-justify: inter-word;
        }

        .bul li:first-child {
            margin-top: 0;
        }

        .bul li::before {
            content: "\2022";
            position: absolute;
            left: calc(7px * var(--content-scale));
            top: 0;
            font-size: calc(16.34px * var(--content-scale));
        }

        /* ===== Certifications & Technical Skills (two columns) ===== */
        .certcols {
            display: flex;
            gap: calc(20px * var(--content-scale));
            margin-top: calc(4px * var(--content-scale));
        }

        .certL,
        .certR {
            flex: 1 1 0;
            min-width: 0;
        }

        .sub-cert,
        .sub-tech {
            font-weight: 700;
            font-style: italic;
            font-size: calc(17.97px * var(--content-scale));
            line-height: 1.1;
            text-decoration: underline;
        }

        .template {
            display: none !important;
        }

        /* Leadership/Interests have no dedicated section in this design and
           auto-inject generically via data-section-append-host (below). */

        /* ── PRINT (A4 exact, same convention as every other template) ── */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            html,
            body {
                background: var(--page-bg);
                width: 210mm;
                height: 297mm;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
            }

            #zoom-wrapper {
                padding: 0;
                display: block;
                min-height: 0;
                width: 100% !important;
                height: auto !important;
            }

            .page {
                box-shadow: none;
                transform: none;
                zoom: 0.79375;
                margin: 0 auto;
                position: static !important;
            }
        }
    </style>
</head>

                <div id="projects-list">
                    <div class="job-entry template">
                        <div class="job-title-block">
                            <div class="job-row">
                                <div class="job-line" data-field="title"></div>
                            </div>
                            <p class="summary" data-field="description"></p>
                        </div>
                        <ul class="bul" data-list="bullets"></ul>
                    </div>
                </div>
            </div>

            <!-- CERTIFICATIONS & TECHNICAL SKILLS (two columns: Certifications +
                 Skills side by side, matching the source design) -->
            <div class="section sortable-section" data-section-id="certifications">
                <div class="section-head">
                    <div class="sec-h section-title">CERTIFICATIONS &amp; TECHNICAL SKILLS</div>
                    <div class="rule"></div>
                </div>
                <div class="certcols">
                    <div class="certL">
                        <div class="sub-cert">Certifications</div>
                        <ul class="bul" data-list="certifications"></ul>
                    </div>
                    <div class="certR">
                        <div class="sub-tech">Technical &amp; Soft Skills</div>
                        <ul class="bul" data-field="skills"></ul>
                    </div>
                </div>
            </div>

            <!-- AWARDS & CO-CURRICULAR -->
            <div class="section sortable-section" data-section-id="achievements">
                <div class="section-head">
                    <div class="sec-h section-title">AWARDS &amp; CO-CURRICULAR</div>
                    <div class="rule"></div>
                </div>
                <div class="section-body"><ul class="bul" data-list="achievements"></ul></div>
            </div>

            <!-- INTERESTS & HOBBIES -->
            <div class="section sortable-section" data-section-id="interests">
                <div class="section-head">
                    <div class="sec-h section-title">INTERESTS &amp; HOBBIES</div>
                    <div class="rule"></div>
                </div>
                <div class="section-body"><ul class="bul" data-list="interests"></ul></div>
            </div>

            <!-- POSITIONS OF RESPONSIBILITY -->
            <div class="section sortable-section" data-section-id="leadership">
                <div class="section-head">
                    <div class="sec-h section-title">POSITIONS OF RESPONSIBILITY</div>
                    <div class="rule"></div>
                </div>
                <div class="section-body"><ul class="bul" data-list="leadership"></ul></div>
            </div>

        </div>
    </div>

    <script src="cv-common.js"></script>
    <script>
        // ── Template-specific post-processing over the shared renderer ──
        const originalRenderCV = window.renderCV;

        window.renderCV = function (data) {
            originalRenderCV(data);

            adjustContactRow(data.personal || {});
            adjustEducationRemarksSeparator();
            adjustExperienceSubsections();

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    shrinkContentToFit();
                    scaleToFit();
                });
            });
        };

        // Bespoke base64 icons stay untouched by cv-common's generic contact
        // renderer (we don't use the `.contact-value` class), so we hide/show
        // each icon+text pair (and its neighbouring "|" separator) ourselves.
        function adjustContactRow(personal) {
            const phoneEl = document.querySelector('#ci-phone [data-field="phone"]');
            const hasPhone = !!(phoneEl && phoneEl.textContent.trim());
            const email = (personal.email || '').trim();
            const linkedin = (personal.linkedin || '').trim();
            const location = (personal.location || '').trim();

            const ciPhone = document.getElementById('ci-phone');
            const ciEmail = document.getElementById('ci-email');
            const ciLinkedin = document.getElementById('ci-linkedin');
            const ciLocation = document.getElementById('ci-location');
            const emailLink = document.getElementById('ci-email-link');
            const linkedinLink = document.getElementById('ci-linkedin-link');

            if (ciPhone) ciPhone.style.display = hasPhone ? '' : 'none';
            if (ciEmail) ciEmail.style.display = email ? '' : 'none';
            if (ciLinkedin) ciLinkedin.style.display = linkedin ? '' : 'none';
            if (ciLocation) ciLocation.style.display = location ? '' : 'none';

            if (emailLink) emailLink.href = email ? 'mailto:' + email : '#';
            if (linkedinLink) {
                linkedinLink.href = linkedin
                    ? (/^https?:\/\//i.test(linkedin) ? linkedin : 'https://' + linkedin)
                    : '#';
            }

            const visible = [hasPhone, email, linkedin, location];
            const sep1 = document.getElementById('sep-1');
            const sep2 = document.getElementById('sep-2');
            const sep3 = document.getElementById('sep-3');
            if (sep1) sep1.style.display = (visible[0] && (visible[1] || visible[2] || visible[3])) ? '' : 'none';
            if (sep2) sep2.style.display = (visible[1] && (visible[2] || visible[3])) ? '' : 'none';
            if (sep3) sep3.style.display = (visible[2] && visible[3]) ? '' : 'none';
            if (visible[0] === false && visible[1] && (visible[2] || visible[3]) && sep1) sep1.style.display = 'none';

            const block = document.getElementById('contact-block');
            if (block) block.style.display = visible.some(Boolean) ? '' : 'none';
        }

        // Hide the " | " separator between marks and remarks when either side
        // is empty, instead of showing a stray "50% | " or " | Cleared".
        function adjustEducationRemarksSeparator() {
            document.querySelectorAll('#education-list > tr:not(.template)').forEach(row => {
                const marks = row.querySelector('[data-field="marks"]');
                const remarks = row.querySelector('[data-field="remarks"]');
                const sep = row.querySelector('.edu-remarks-sep');
                if (!sep) return;
                const hasMarks = !!(marks && marks.textContent.trim());
                const hasRemarks = !!(remarks && remarks.textContent.trim());
                sep.style.display = (hasMarks && hasRemarks) ? '' : 'none';
            });
        }

        // The source shows one job-line header ("Articled Assistant | P. K.
        // Ajmera & Co.") followed by two bold underlined italic subsection
        // labels ("Audit & Assurance" / "Taxation & Advisory"), each with its
        // own bullets — the builder's "merge experience title with previous"
        // subsection feature. cv-common already hides role/company/dates on
        // merged entries; detect that and show the entry's own role text as
        // the subhead label instead.
        function adjustExperienceSubsections() {
            document.querySelectorAll('#experience-list > .job-entry').forEach(entry => {
                if (entry.classList.contains('template')) return;
                const roleEl = entry.querySelector('[data-field="role"]');
                const subhead = entry.querySelector('.subhead');
                const isSubsection = entry.classList.contains('experience-title-merged') || !!(roleEl && roleEl.style.display === 'none');

                entry.classList.toggle('is-subsection', isSubsection);
                if (subhead) {
                    const roleText = (roleEl?.textContent || '').trim();
                    const subText = (subhead.textContent || '').trim();
                    if (isSubsection) {
                        subhead.textContent = roleText || subText || '';
                    } else {
                        if (subText) subhead.textContent = subText;
                    }
                    subhead.style.display = subhead.textContent.trim() ? 'block' : 'none';
                }
            });
        }

        // ── Standard scaling / print plumbing (same contract as other templates) ──
        function scaleToFit() {
            const page = document.getElementById('cv-page');
            const targetWidth = window.innerWidth - 20;
            const scale = targetWidth < 1000 ? targetWidth / 1000 : 1.0;
            page.style.transform = `scale(${scale})`;
            const spaceToRemove = 1413.94 - (1413.94 * scale);
            page.style.marginBottom = `-${spaceToRemove}px`;
        }

        function shrinkContentToFit() {
            const page = document.getElementById('cv-page');
            let contentScale = 1.0;
            document.documentElement.style.setProperty('--content-scale', contentScale);
            page.style.height = 'auto';
            let i = 0;
            while (page.scrollHeight > 1415 && i < 60) {
                contentScale -= 0.01;
                document.documentElement.style.setProperty('--content-scale', contentScale);
                i++;
            }
            page.style.height = '';
        }

        let _screenTransform = '';
        let _screenMarginBottom = '';

        function enablePrintMode() {
            const page = document.getElementById('cv-page');
            _screenTransform = page.style.transform;
            _screenMarginBottom = page.style.marginBottom;
            page.style.transform = 'scale(1)';
            page.style.marginBottom = '0px';
            shrinkContentToFit();
        }

        function disablePrintMode() {
            const page = document.getElementById('cv-page');
            page.style.transform = _screenTransform || '';
            page.style.marginBottom = _screenMarginBottom || '';
            scaleToFit();
        }

        window.addEventListener('load', function () {
            shrinkContentToFit();
            scaleToFit();
            const mq = window.matchMedia('print');
            if (mq.addEventListener) {
                mq.addEventListener('change', e => e.matches ? enablePrintMode() : disablePrintMode());
            } else if (mq.addListener) {
                mq.addListener(e => e.matches ? enablePrintMode() : disablePrintMode());
            }
            window.addEventListener('beforeprint', enablePrintMode);
            window.addEventListener('afterprint', disablePrintMode);
        });

        let _resizeTimer;
        window.addEventListener('resize', function () {
            clearTimeout(_resizeTimer);
            _resizeTimer = setTimeout(scaleToFit, 100);
        });
    </script>
</body>

</html>
