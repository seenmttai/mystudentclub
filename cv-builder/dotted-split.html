<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Resume - Dotted Split</title>
<style>

:root {
  --accent-color:  #002060;
  --steel-blue:    var(--accent-color, #1A5889);
  --text-dark:     #292C2C;
  --text-body:     #424242;
  --text-muted:    #7B8181;
  --divider-gray:  #E5E7EB;
  --page-bg:       #FFFFFF;
  --viewer-bg:     #525659;
  --font-main:     'Microsoft Sans Serif', 'Segoe UI', Arial, sans-serif;
  --cs:            1.0;
}

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

body {
  background: var(--viewer-bg);
  font-family: var(--font-main);
  color: var(--text-dark);
  min-height: 100vh;
  width: 100vw;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 0;
  transition: opacity 0.2s ease-in;
}

#zoom-wrapper {
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 24px 0 32px;
}

#cv-page {
  position: relative;
  width: 1000px;
  min-height: 1413.94px;
  background: var(--page-bg);
  color: var(--text-dark);
  padding: 40px 45px 35px 45px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
  flex-shrink: 0;
  transform-origin: top center;
  font-size: calc(16px * var(--cs));
  line-height: 1.44;
}

.template { display: none !important; }

/* ── Header Section ── */
.header-container {
  margin-bottom: calc(14px * var(--cs));
}

.candidate-name {
  font-size: calc(32px * var(--cs));
  font-weight: 700;
  color: var(--text-dark);
  line-height: 1.1;
  margin-bottom: calc(2px * var(--cs));
}

.candidate-subtitle {
  font-size: calc(16px * var(--cs));
  color: var(--steel-blue);
  margin-bottom: calc(6px * var(--cs));
}

.contact-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: calc(16px * var(--cs));
  font-size: calc(14px * var(--cs));
  color: var(--text-dark);
}

.contact-item {
  display: flex;
  align-items: center;
  gap: calc(5px * var(--cs));
}

.contact-item a {
  color: var(--text-dark);
  text-decoration: none;
}

.contact-item a:hover {
  text-decoration: underline;
}

.sortable-section {
  margin-bottom: calc(10px * var(--cs));
}

/* Section Banner Headings */
.section-banner {
  font-size: calc(16.5px * var(--cs));
  font-weight: 700;
  color: var(--steel-blue);
  text-transform: uppercase;
  border-bottom: calc(2px * var(--cs)) solid var(--steel-blue);
  padding-bottom: calc(2px * var(--cs));
  margin-top: calc(16px * var(--cs));
  margin-bottom: calc(8px * var(--cs));
  letter-spacing: 0.3px;
}

.column-left .sortable-section:first-child .section-banner,
.column-right .sortable-section:first-child .section-banner {
  margin-top: 0;
}

/* ── 2-Column Grid Layout ── */
.main-content {
  display: grid;
  grid-template-columns: 58% 39%;
  column-gap: 3%;
}

.summary-paragraph {
  font-size: calc(14px * var(--cs));
  line-height: 1.44;
  color: var(--text-body);
  text-align: justify;
  margin-bottom: calc(12px * var(--cs));
}

.exp-entry {
  margin-bottom: calc(12px * var(--cs));
  padding-bottom: calc(8px * var(--cs));
  border-bottom: calc(1px * var(--cs)) dotted #D1D5DB;
}

.exp-entry:last-child {
  border-bottom: none;
  margin-bottom: 0;
}

.exp-header-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: calc(2px * var(--cs));
}

.exp-title {
  font-size: calc(15.5px * var(--cs));
  font-weight: 700;
  color: var(--text-dark);
}

.exp-date {
  font-size: calc(12px * var(--cs));
  color: var(--text-muted);
}

.exp-company {
  font-size: calc(16px * var(--cs));
  font-weight: 700;
  color: var(--steel-blue);
  margin-bottom: calc(4px * var(--cs));
}

.exp-desc {
  font-size: calc(13.5px * var(--cs));
  font-style: italic;
  color: var(--text-body);
  margin-bottom: calc(4px * var(--cs));
}

.bullet-list {
  list-style-type: disc;
  padding-left: calc(16px * var(--cs));
  font-size: calc(14px * var(--cs));
  line-height: 1.44;
  color: var(--text-body);
  margin-bottom: calc(8px * var(--cs));
}

.bullet-list li {
  margin-bottom: calc(4px * var(--cs));
  text-align: justify;
}

.bullet-list li:last-child {
  margin-bottom: 0;
}

/* Right Column Education & Skills Blocks */
.edu-block {
  margin-bottom: calc(8px * var(--cs));
  padding-bottom: calc(8px * var(--cs));
  border-bottom: calc(1px * var(--cs)) dotted #D1D5DB;
}

.edu-block:last-child {
  border-bottom: none;
  margin-bottom: 0;
  padding-bottom: 0;
}

.edu-degree {
  font-size: calc(15.5px * var(--cs));
  font-weight: 700;
  color: var(--text-dark);
}

.edu-inst {
  font-size: calc(14.2px * var(--cs));
  font-weight: 700;
  color: var(--steel-blue);
  margin-bottom: calc(2px * var(--cs));
}

.edu-date {
  font-size: calc(12px * var(--cs));
  color: var(--text-muted);
  margin-bottom: calc(2px * var(--cs));
}

.edu-details-row {
  margin-top: calc(4px * var(--cs));
  line-height: 1.35;
}
.edu-marks {
  display: inline-block;
  font-size: calc(12.2px * var(--cs));
  font-weight: 600;
  color: var(--text-body);
  border: calc(1px * var(--cs)) solid #e2e8f0;
  background-color: #f8fafc;
  padding: calc(1px * var(--cs)) calc(6px * var(--cs));
  border-radius: calc(3px * var(--cs));
  margin-right: calc(6px * var(--cs));
}
.edu-remarks {
  display: inline-block;
  font-size: calc(12.2px * var(--cs));
  font-style: italic;
  color: var(--text-muted);
}

.skills-text {
  font-size: calc(14px * var(--cs));
  line-height: 1.44;
  color: var(--text-body);
}

@media print {
  html, body {
    background: none !important;
    margin: 0;
    padding: 0;
  }
  #zoom-wrapper {
    padding: 0;
  }
  #cv-page {
    transform: scale(1) !important;
    margin: 0 !important;
    width: 210mm;
    min-height: 297mm;
    box-shadow: none;
    padding: 10mm 11mm 10mm 11mm;
  }
  @page {
    size: A4 portrait;
    margin: 0;
  }
}
</style>
</head>
<body>
<div id="zoom-wrapper">
<div id="cv-page">

  <!-- ══ HEADER SECTION ══════════════════════════════════════════ -->
  <div class="header-container">
    <h1 class="candidate-name" data-field="name">Padam Bhansali</h1>
    <div class="candidate-subtitle" data-field="tagline">Chartered Accountant</div>
    <div class="contact-row contact-block">
      <div class="contact-item contact-row">
        <span class="contact-value" data-field="phone">+91 7228881182</span>
      </div>
      <div class="contact-item contact-row">
        <span>✉</span> <a href="#" class="contact-value" data-field="email">capadambhansali@gmail.com</a>
      </div>
      <div class="contact-item contact-row">
        <span>🔗</span> <a href="#" target="_blank" rel="noopener" class="contact-value" data-field="linkedin">linkedin.com/in/ca-padam-bhansali</a>
      </div>
      <div class="contact-item contact-row">
        <span class="contact-value" data-field="location">Mumbai</span>
      </div>
    </div>
  </div>

  <!-- ══ MAIN 2-COLUMN CONTENT ══════════════════════════════════ -->
  <div class="main-content">

    <!-- ── LEFT COLUMN ── -->
    <div class="column-left">

      <div class="sortable-section" data-section-id="summary">
        <div class="section-banner">Summary</div>
        <p class="summary-paragraph" data-field="summary"></p>
      </div>

      <div class="sortable-section" data-section-id="experience">
        <div class="section-banner">Experience</div>
        <div id="experience-list">
          <div class="exp-entry template">
            <div class="exp-header-row">
              <span class="exp-title" data-field="role"></span>
              <span class="exp-date" data-field="dates"></span>
            </div>
            <div class="exp-company" data-field="company"></div>
            <div class="exp-desc" data-field="category"></div>
            <div class="exp-desc" data-field="intro"></div>
            <ul class="bullet-list" data-list="bullets"></ul>
          </div>
        </div>
      </div>

      <div class="sortable-section" data-section-id="projects">
        <div class="section-banner">Projects</div>
        <div id="projects-list">
          <div class="exp-entry template">
            <div class="exp-header-row">
              <span class="exp-title" data-field="title"></span>
            </div>
            <div class="exp-desc" data-field="description"></div>
            <ul class="bullet-list" data-list="bullets"></ul>
          </div>
        </div>
      </div>

    </div>

    <!-- ── RIGHT COLUMN ── -->
    <div class="column-right" data-section-append-host>

      <div class="sortable-section" data-section-id="education">
        <div class="section-banner">Education</div>
        <div id="education-list">
          <div class="edu-block template">
            <div class="exp-header-row">
              <span class="edu-degree" data-field="degree"></span>
              <span class="edu-date" data-field="year"></span>
            </div>
            <div data-field="institution-header">
              <div class="edu-inst" data-field="institution"></div>
            </div>
            <div class="edu-details-row">
              <span class="edu-marks" data-field="marks"></span>
              <span class="edu-remarks" data-field="remarks"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="sortable-section" data-section-id="skills">
        <div class="section-banner">Skills</div>
        <div class="skills-text" data-field="skills"></div>
      </div>

      <div class="sortable-section" data-section-id="certifications">
        <div class="section-banner">Certifications</div>
        <ul class="bullet-list" id="cert-list" data-list="certifications"></ul>
      </div>

      <div class="sortable-section" data-section-id="achievements">
        <div class="section-banner">Achievements</div>
        <ul class="bullet-list" data-list="achievements"></ul>
      </div>

      <div class="sortable-section" data-section-id="leadership">
        <div class="section-banner">Leadership</div>
        <ul class="bullet-list" data-list="leadership"></ul>
      </div>

      <div class="sortable-section" data-section-id="interests">
        <div class="section-banner">Interests</div>
        <ul class="bullet-list" data-list="interests"></ul>
      </div>

    </div>

  </div><!-- .main-content -->

</div><!-- #cv-page -->
</div><!-- #zoom-wrapper -->

<script src="cv-common.js"></script>
<script>
(function () {
  'use strict';

  var PAGE_H = 1413.94;
  var PAGE_W = 1000;

  function scaleToFit() {
    var page = document.getElementById('cv-page');
    if (!page || document.body.classList.contains('print-mode')) return;
    var avail = window.innerWidth - 20;
    var scale = avail < PAGE_W ? avail / PAGE_W : 1.0;
    page.style.transform = 'scale(' + scale + ')';
    page.style.marginBottom = '-' + (PAGE_H - PAGE_H * scale) + 'px';
  }

  function shrinkContentToFit() {
    var page = document.getElementById('cv-page');
    if (!page) return;
    var cs = 1.0;
    document.documentElement.style.setProperty('--cs', cs);
    page.style.height = 'auto';
    var iter = 0;
    while (page.scrollHeight > PAGE_H + 1 && iter < 80) {
      cs = Math.round((cs - 0.01) * 1000) / 1000;
      document.documentElement.style.setProperty('--cs', cs);
      iter++;
    }
    page.style.height = '';
  }

  window.scaleToFit = scaleToFit;
  window.shrinkContentToFit = shrinkContentToFit;

  var _tx = '', _mb = '';

  function enablePrintMode() {
    var page = document.getElementById('cv-page');
    if (!page) return;
    _tx = page.style.transform;
    _mb = page.style.marginBottom;
    document.body.classList.add('print-mode');
    page.style.transform = 'scale(1)';
    page.style.marginBottom = '0';
    shrinkContentToFit();
  }

  function disablePrintMode() {
    var page = document.getElementById('cv-page');
    if (!page) return;
    document.body.classList.remove('print-mode');
    page.style.transform = _tx || '';
    page.style.marginBottom = _mb || '';
    scaleToFit();
  }

  window.addEventListener('load', function () {
    shrinkContentToFit();
    scaleToFit();
    document.body.style.opacity = '1';
    var mq = window.matchMedia('print');
    var handler = function (e) { e.matches ? enablePrintMode() : disablePrintMode(); };
    if (mq.addEventListener) { mq.addEventListener('change', handler); }
    else if (mq.addListener)  { mq.addListener(handler); }
    window.addEventListener('beforeprint', enablePrintMode);
    window.addEventListener('afterprint',  disablePrintMode);
  });

  var _rt;
  window.addEventListener('resize', function () {
    clearTimeout(_rt);
    _rt = setTimeout(scaleToFit, 100);
  });
}());
</script>
</body>
</html>
