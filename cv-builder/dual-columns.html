<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Resume</title>
    <style>
        :root {
            --dark: var(--header-bg, #292C2C);
            --heading: var(--header-bg, #404242);
            --gray: #333333;
            --company: #292D2D;
            --dategray: #616464;
            --divider: #B9C1C8;
            --page-bg: #ffffff;
            --viewer-bg: #525659;
            --font-main: "Microsoft Sans Serif", Arial, Helvetica, sans-serif;
            --content-scale: 1.0;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body {
            background-color: var(--viewer-bg);
            font-family: var(--font-main);
            overflow-x: hidden;
            min-height: 100vh;
            width: 100vw;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #zoom-wrapper {
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            padding: 24px 0;
        }

        /* Page grows with content (min-height only, no overflow:hidden anywhere
           above the text) so shrinkContentToFit() can measure true overflow. */
        .page {
            position: relative;
            width: 1000px;
            min-height: 1413.94px;
            background: var(--page-bg);
            box-shadow: 0 4px 24px rgba(0, 0, 0, .55);
            color: var(--gray);
            transform-origin: top center;
            flex-shrink: 0;
            padding-bottom: calc(20px * var(--content-scale));
        }

        /* ===== Header ===== */
        .header {
            background: var(--dark);
            color: #fff;
            padding: calc(20.13px * var(--content-scale)) 0 calc(16.78px * var(--content-scale)) calc(30.20px * var(--content-scale));
        }

        .h-name {
            margin: 0;
            font-size: calc(35.23px * var(--content-scale));
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            line-height: 1.1;
        }

        .h-subtitle {
            margin: calc(1.68px * var(--content-scale)) 0 0 0;
            font-size: calc(20.13px * var(--content-scale));
            font-weight: 400;
        }

        .h-contact {
            margin-top: calc(11.74px * var(--content-scale));
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            column-gap: calc(23.49px * var(--content-scale));
            row-gap: calc(6px * var(--content-scale));
            font-size: calc(15.94px * var(--content-scale));
        }

        .h-contact .item {
            display: flex;
            align-items: center;
            gap: calc(6.71px * var(--content-scale));
            white-space: nowrap;
            max-width: 100%;
            overflow-wrap: anywhere;
        }

        .h-contact img {
            width: calc(13.42px * var(--content-scale));
            height: calc(13.42px * var(--content-scale));
            flex: 0 0 auto;
            display: block;
            filter: brightness(0) invert(1);
        }

        .h-contact img.email-ic {
            width: calc(14.60px * var(--content-scale));
            height: calc(11.74px * var(--content-scale));
        }

        .h-contact img.pin-ic {
            width: calc(14.26px * var(--content-scale));
            height: calc(15.10px * var(--content-scale));
        }

        .h-contact a {
            color: #fff;
            text-decoration: underline;
        }

        /* ===== Body columns ===== */
        .cols-row {
            display: flex;
            padding: 0 23.74px;
            gap: 28.10px;
        }

        .colL {
            flex: 0 0 533.14px;
            width: 533.14px;
        }

        .colR {
            flex: 1 1 auto;
        }

        .section {
            margin-top: calc(20.13px * var(--content-scale));
        }

        .section:first-child,
        .colL .section:first-child,
        .colR .section:first-child {
            margin-top: calc(13.42px * var(--content-scale));
        }

        .section-title {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            font-size: calc(19.30px * var(--content-scale));
            color: var(--heading);
            margin-bottom: 2px;
        }

        .rule {
            height: calc(3.78px * var(--content-scale));
            background: var(--heading);
            margin: calc(2px * var(--content-scale)) 0 calc(4px * var(--content-scale)) 0;
        }

        /* ===== Summary ===== */
        .summary-text {
            margin: 0;
            font-size: calc(15.94px * var(--content-scale));
            line-height: 1.32;
            color: var(--gray);
            text-align: justify;
        }

        .summary-text b {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
        }

        /* ===== Work experience / Projects ===== */
        .job-entry {
            margin-top: calc(13.42px * var(--content-scale));
        }

        .job-entry:first-child {
            margin-top: 0;
        }

        .job-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: calc(6.71px * var(--content-scale));
        }

        .job-title {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            font-size: calc(17.62px * var(--content-scale));
            color: var(--heading);
            flex: 1 1 auto;
            min-width: 0;
        }

        .job-date {
            display: inline-flex;
            align-items: center;
            gap: calc(6.71px * var(--content-scale));
            font-size: calc(15.94px * var(--content-scale));
            color: var(--dategray);
            white-space: nowrap;
            line-height: 1;
            flex: 0 0 auto;
        }

        .job-date img {
            width: calc(13.84px * var(--content-scale));
            height: calc(13.84px * var(--content-scale));
            flex: none;
            vertical-align: middle;
            position: relative;
            top: -1.26px;
            filter: brightness(0);
        }

        .job-company-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: calc(3.36px * var(--content-scale));
        }

        .job-company-row:empty {
            display: none;
        }

        .job-company {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            font-size: calc(15.94px * var(--content-scale));
            color: var(--company);
        }

        .job-category {
            font-size: calc(15.94px * var(--content-scale));
            color: var(--dategray);
            white-space: nowrap;
            line-height: 1;
        }

        .job-category:empty {
            display: none;
        }

        .subhead {
            display: inline-block;
            margin-top: calc(4.70px * var(--content-scale));
            margin-bottom: calc(2px * var(--content-scale));
            padding-bottom: calc(1.68px * var(--content-scale));
            border-bottom: calc(1.26px * var(--content-scale)) solid #000000;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            font-size: calc(15.94px * var(--content-scale));
            color: #292C2C;
        }

        .subhead:empty {
            display: none;
        }

        .job-entry.is-subsection .job-title-block {
            display: none;
        }

        .job-entry.is-subsection .subhead {
            display: inline-block;
            margin-top: calc(8px * var(--content-scale));
        }

        .bullets {
            list-style: none;
            margin: calc(4.19px * var(--content-scale)) 0 0 0;
            padding: 0;
        }

        .bullets li {
            position: relative;
            padding-left: calc(20.13px * var(--content-scale));
            margin-top: calc(4.19px * var(--content-scale));
            font-size: calc(15.94px * var(--content-scale));
            line-height: 1.15;
            color: var(--gray);
            text-align: justify;
        }

        .bullets li:first-child {
            margin-top: 0;
        }

        .bullets li::before {
            content: "";
            position: absolute;
            left: calc(3.36px * var(--content-scale));
            top: .5em;
            width: calc(5.03px * var(--content-scale));
            height: calc(5.03px * var(--content-scale));
            border-radius: 50%;
            background: var(--gray);
            transform: translateY(-50%);
        }

        .bullets b {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
        }

        .proj-desc {
            margin-top: calc(4.19px * var(--content-scale));
            font-size: calc(15.94px * var(--content-scale));
            line-height: 1.2;
            color: var(--gray);
            text-align: justify;
        }

        .proj-desc:empty {
            display: none;
        }

        /* ===== Education (right col) ===== */
        .edu-entry {
            display: flex;
            margin-top: calc(12px * var(--content-scale));
        }

        .edu-entry:first-child {
            margin-top: 0;
        }

        .edu-main {
            flex: 1 1 auto;
            min-width: 0;
        }

        .edu-course {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            font-size: calc(16.78px * var(--content-scale));
            color: var(--heading);
        }

        .edu-inst {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            font-size: calc(15.94px * var(--content-scale));
            color: var(--heading);
            margin-top: calc(4.19px * var(--content-scale));
        }

        .edu-inst:empty {
            display: none;
        }

        .edu-date {
            display: flex;
            align-items: center;
            gap: calc(5.03px * var(--content-scale));
            font-size: calc(15.10px * var(--content-scale));
            color: var(--dategray);
            margin-top: calc(4.19px * var(--content-scale));
        }

        .edu-date img {
            width: calc(12.58px * var(--content-scale));
            height: calc(13.76px * var(--content-scale));
            flex: 0 0 auto;
            filter: brightness(0) saturate(100%) invert(43%);
        }

        .edu-desc {
            font-size: calc(15.10px * var(--content-scale));
            color: var(--gray);
            line-height: 1.35;
            margin-top: calc(4.19px * var(--content-scale));
            text-align: justify;
        }

        .edu-desc:empty {
            display: none;
        }

        .edu-desc b {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
        }

        .edu-div {
            width: calc(2.52px * var(--content-scale));
            background: var(--divider);
            margin: calc(3.36px * var(--content-scale)) calc(13.42px * var(--content-scale));
            flex: 0 0 auto;
            align-self: stretch;
        }

        .edu-score {
            flex: 0 0 97.32px;
            text-align: center;
            padding-top: calc(3.36px * var(--content-scale));
        }

        .edu-score .lbl {
            font-size: calc(14.26px * var(--content-scale));
            color: var(--dategray);
        }

        .edu-score .val {
            display: inline;
            font-size: calc(20.13px * var(--content-scale));
            font-weight: 700;
            color: var(--heading);
            font-family: Arial, Helvetica, sans-serif;
            overflow-wrap: anywhere;
        }

        .edu-sep {
            border: none;
            border-top: calc(1.2px * var(--content-scale)) solid #c7cccc;
            margin: calc(12px * var(--content-scale)) 0 0 0;
        }

        /* ===== Skills ===== */
        [data-field="skills"] {
            font-size: calc(15.10px * var(--content-scale));
            color: var(--gray);
            line-height: 1.5;
        }

        [data-field="skills"] p {
            margin: 0;
        }

        [data-field="skills"] p+p {
            margin-top: calc(11.74px * var(--content-scale));
            padding-top: calc(11.74px * var(--content-scale));
            border-top: calc(1.59px * var(--content-scale)) solid #c7cccc;
        }

        [data-field="skills"] b {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            color: var(--heading);
        }

        .template {
            display: none !important;
        }

        /* ── PRINT (A4 exact, same convention as every other template) ── */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            html,
            body {
                background: var(--page-bg);
                width: 210mm;
                height: 297mm;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
            }

            #zoom-wrapper {
                padding: 0;
                display: block;
                min-height: 0;
                width: 100% !important;
                height: auto !important;
            }

            .page {
                box-shadow: none;
                transform: none;
                zoom: 0.79375;
                margin: 0 auto;
                position: static !important;
            }
        }
    </style>
</head>

                                            alt=""><span data-field="year"></span></div>
                                    <div class="edu-desc" data-field="remarks"></div>
                                </div>
                                <div class="edu-div"></div>
                                <div class="edu-score">
                                    <div class="lbl">Score</div>
                                    <div class="val" data-field="marks"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="section sortable-section" data-section-id="skills">
                        <div class="section-head">
                            <div class="section-title">SKILLS</div>
                            <div class="rule"></div>
                        </div>
                        <div class="section-body"><div data-field="skills"></div></div>
                    </div>

                    <div class="section sortable-section" data-section-id="interests">
                        <div class="section-head">
                            <div class="section-title">INTERESTS & HOBBIES</div>
                            <div class="rule"></div>
                        </div>
                        <div class="section-body"><ul class="bullets" data-list="interests"></ul></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="cv-common.js"></script>
    <script>
        // ── Template-specific post-processing over the shared renderer ──
        const originalRenderCV = window.renderCV;

        window.renderCV = function (data) {
            originalRenderCV(data);

            adjustContactRow(data.personal || {});
            adjustExperienceSubsections();
            refreshEducationScoreBoxes();
            fixUniversalAndCustomSectionHeaders(data);
            moveCertificationsUnderProjects();

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    shrinkContentToFit();
                    scaleToFit();
                });
            });
        };

        // Certifications, Achievements and Leadership have no native section
        // in this template's source design (only Skills/Interests are real),
        // so cv-common.js synthesizes a bare "<title div> + <ul>" placeholder
        // for each with none of this template's own .section-head/.rule
        // wrapper — they render with the title text but no underline bar,
        // unlike every real header. A user-added custom section clones one
        // of those same synthesized sections as its structural template, so
        // it inherits the same flat shape; worse, cv-common.js's cleanup
        // step for custom sections only preserves a header carrying its own
        // generic "section-header" class, and these placeholders don't have
        // that class, so the custom section's header gets removed entirely.
        // Fix both by rebuilding the .section-head/.rule/.section-body
        // wrapper in place — reusing the SAME <ul> element (not recreating
        // it) so cv-common's normal per-render list population keeps working
        // on it afterward.
        function fixUniversalAndCustomSectionHeaders(data) {
            // Custom sections are torn down and rebuilt from scratch on every
            // render (cv-common's renderCustomSections() always clones fresh),
            // so a rebuilt clone can carry a stale "bullet-list" class from
            // cv-common's own hardcoded fallback even on a render where the
            // .section-head wrapper below was already inherited pre-built
            // (from cloning a reference this same function had already fixed
            // on an earlier render). So the class cleanup always runs; only
            // the structural wrap is skipped once already present.
            const wrapInSectionHead = (wrapper, titleText) => {
                const list = wrapper.querySelector('[data-list]');
                if (!list) return;

                list.classList.remove('bullet-list');
                if (!list.classList.contains('bullets')) list.classList.add('bullets');

                if (wrapper.querySelector(':scope > .section-head')) return;

                const head = document.createElement('div');
                head.className = 'section-head';
                const titleDiv = document.createElement('div');
                titleDiv.className = 'section-title';
                titleDiv.textContent = (titleText || '').toUpperCase();
                const rule = document.createElement('div');
                rule.className = 'rule';
                head.appendChild(titleDiv);
                head.appendChild(rule);

                let body = list.closest('.section-body');
                if (!body) {
                    body = document.createElement('div');
                    body.className = 'section-body';
                    wrapper.insertBefore(body, list);
                    body.appendChild(list);
                }
                wrapper.insertBefore(head, body);
            };

            ['certifications', 'achievements', 'leadership'].forEach(key => {
                const wrapper = document.querySelector(`.sortable-section[data-section-id="${key}"].universal-injected`);
                if (!wrapper) return;
                const titleEl = wrapper.querySelector(':scope > .section-title');
                const titleText = titleEl ? titleEl.textContent : '';
                if (titleEl) titleEl.remove();
                wrapInSectionHead(wrapper, titleText);
            });

            (data.customSections || []).forEach(section => {
                const wrapper = document.querySelector(`[data-custom-section-root="${section.id}"]`);
                if (!wrapper) return;
                wrapInSectionHead(wrapper, section.title || 'Custom Section');
            });
        }

        function moveCertificationsUnderProjects() {
            const projectsSection = document.querySelector('.colL .sortable-section[data-section-id="projects"]');
            const certSection = document.querySelector('.sortable-section[data-section-id="certifications"]');
            if (!projectsSection || !certSection) return;
            if (certSection.previousElementSibling !== projectsSection) {
                projectsSection.insertAdjacentElement('afterend', certSection);
            }
        }

        // Bespoke base64 icons stay untouched by cv-common's generic contact
        // renderer (we don't use the `.contact-value` class), so we hide/show
        // each icon+text pair ourselves and wire the LinkedIn href by hand
        // (the visible label stays the word "LinkedIn", matching the source).
        function adjustContactRow(personal) {
            const phoneEl = document.querySelector('#ci-phone [data-field="phone"]');
            const ciPhone = document.getElementById('ci-phone');
            const ciEmail = document.getElementById('ci-email');
            const ciLinkedin = document.getElementById('ci-linkedin');
            const ciLocation = document.getElementById('ci-location');
            const linkedinLink = document.getElementById('ci-linkedin-link');

            const hasPhone = !!(phoneEl && phoneEl.textContent.trim());
            const email = (personal.email || '').trim();
            const linkedin = (personal.linkedin || '').trim();
            let location = (personal.location || '').trim();

            // Guard against a known bad-import artifact: the AI-based resume
            // import occasionally mis-parses the "LinkedIn" contact label
            // itself as the location value, producing a confusing duplicate
            // "LinkedIn" next to the location pin. Suppress that specific case
            // rather than render it — a location field that's just the word
            // "linkedin", or an exact copy of the linkedin field, is never a
            // real location.
            const looksLikeMisimportedLinkedIn =
                /^linkedin(\.com)?$/i.test(location) ||
                (linkedin && location.toLowerCase() === linkedin.toLowerCase());
            if (looksLikeMisimportedLinkedIn) location = '';

            if (ciPhone) ciPhone.style.display = hasPhone ? '' : 'none';
            if (ciEmail) ciEmail.style.display = email ? '' : 'none';
            if (ciLinkedin) ciLinkedin.style.display = linkedin ? '' : 'none';
            if (ciLocation) ciLocation.style.display = location ? '' : 'none';

            if (linkedinLink) {
                linkedinLink.href = linkedin
                    ? (/^https?:\/\//i.test(linkedin) ? linkedin : 'https://' + linkedin)
                    : '#';
            }
        }

        // The source shows one "Articleship" job header followed by three bold
        // underlined subsection labels (Statutory Audit / Direct Taxation /
        // Indirect Taxation), each with its own bullets — that is exactly the
        // builder's "merge experience title with previous" subsection feature.
        // cv-common already hides role/company/dates on merged entries; we
        // detect that and show our own .subhead label (the entry's own role
        // text) in their place instead.
        function adjustExperienceSubsections() {
            document.querySelectorAll('#experience-list > .job-entry').forEach(entry => {
                if (entry.classList.contains('template')) return;
                const roleEl = entry.querySelector('[data-field="role"]');
                const subhead = entry.querySelector('.subhead');
                const isSubsection = entry.classList.contains('experience-title-merged') || !!(roleEl && roleEl.style.display === 'none');

                entry.classList.toggle('is-subsection', isSubsection);
                if (subhead) {
                    const roleText = (roleEl?.textContent || '').trim();
                    const subText = (subhead.textContent || '').trim();
                    if (isSubsection) {
                        subhead.textContent = roleText || subText || '';
                    } else {
                        if (subText) subhead.textContent = subText;
                    }
                    subhead.style.display = subhead.textContent.trim() ? 'inline-block' : 'none';
                }
            });
        }

        // Hide the score box + divider for an education entry when marks is
        // empty, instead of showing an empty "Score" label with nothing after it.
        function refreshEducationScoreBoxes() {
            document.querySelectorAll('#education-list > .edu-entry').forEach(entry => {
                if (entry.classList.contains('template')) return;
                const valEl = entry.querySelector('[data-field="marks"]');
                const hasScore = !!(valEl && valEl.textContent.trim());
                const div = entry.querySelector('.edu-div');
                const score = entry.querySelector('.edu-score');
                if (div) div.style.display = hasScore ? '' : 'none';
                if (score) score.style.display = hasScore ? '' : 'none';

                const yearEl = entry.querySelector('[data-field="year"]');
                const dateRow = entry.querySelector('.edu-date');
                if (dateRow) dateRow.style.display = (yearEl && yearEl.textContent.trim()) ? '' : 'none';
            });
        }

        // ── Standard scaling / print plumbing (same contract as other templates) ──
        function scaleToFit() {
            const page = document.getElementById('cv-page');
            const targetWidth = window.innerWidth - 20;
            const scale = targetWidth < 1000 ? targetWidth / 1000 : 1.0;
            page.style.transform = `scale(${scale})`;
            const spaceToRemove = 1413.94 - (1413.94 * scale);
            page.style.marginBottom = `-${spaceToRemove}px`;
        }

        function shrinkContentToFit() {
            const page = document.getElementById('cv-page');
            let contentScale = 1.0;
            document.documentElement.style.setProperty('--content-scale', contentScale);
            page.style.height = 'auto';
            let i = 0;
            while (page.scrollHeight > 1415 && i < 60) {
                contentScale -= 0.01;
                document.documentElement.style.setProperty('--content-scale', contentScale);
                i++;
            }
            page.style.height = '';
        }

        let _screenTransform = '';
        let _screenMarginBottom = '';

        function enablePrintMode() {
            const page = document.getElementById('cv-page');
            _screenTransform = page.style.transform;
            _screenMarginBottom = page.style.marginBottom;
            page.style.transform = 'scale(1)';
            page.style.marginBottom = '0px';
            shrinkContentToFit();
        }

        function disablePrintMode() {
            const page = document.getElementById('cv-page');
            page.style.transform = _screenTransform || '';
            page.style.marginBottom = _screenMarginBottom || '';
            scaleToFit();
        }

        window.addEventListener('load', function () {
            shrinkContentToFit();
            scaleToFit();
            const mq = window.matchMedia('print');
            if (mq.addEventListener) {
                mq.addEventListener('change', e => e.matches ? enablePrintMode() : disablePrintMode());
            } else if (mq.addListener) {
                mq.addListener(e => e.matches ? enablePrintMode() : disablePrintMode());
            }
            window.addEventListener('beforeprint', enablePrintMode);
            window.addEventListener('afterprint', disablePrintMode);
        });

        let _resizeTimer;
        window.addEventListener('resize', function () {
            clearTimeout(_resizeTimer);
            _resizeTimer = setTimeout(scaleToFit, 100);
        });
    </script>
</body>
