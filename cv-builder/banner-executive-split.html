<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Banner Executive Split CV</title>
<style>
/* ═══════════════════════════════════════════════════════════
   DESIGN SYSTEM & ENGINE TOKENS — Banner Executive Split
   Page: A4 (1000 px base viewer width × 1413.94 px height)
   Scaling Engine:
     - --cs (content-scale factor): shrinkContentToFit() dynamically
       adjusts --cs so all content fits strictly within 1413.94 px (A4 1-page limit).
     - scaleToFit(): viewport responsive scaling using transform: scale().
 ═══════════════════════════════════════════════════════════ */

:root {
  --banner-blue:   var(--accent-color, #05436E);   /* Banner Accent */
  --banner-txt:    #FFFFFF;   /* White Banner Text */
  --card-bg:       color-mix(in srgb, var(--accent-color, #05436E) 12%, #FFFFFF);   /* Dynamic Soft Tint for Cards & Sub-bar */
  --text-dark:     #292C2C;   /* Dark Charcoal Text */
  --text-body:     #424242;   /* Paragraph Body Text */
  --text-muted:    #6C7578;   /* Secondary Muted Text */
  --link-blue:     var(--accent-color, #004070);   /* Dynamic Link Blue */
  --page-bg:       #FFFFFF;   /* White A4 Sheet */
  --viewer-bg:     #525659;   /* Outer Canvas Background */
  --font-main:     Calibri, 'Segoe UI', Arial, sans-serif;
  --cs:            1.0;       /* Content scale variable adjusted by shrinkContentToFit() */
}

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

body {
  background: var(--viewer-bg);
  font-family: var(--font-main);
  color: var(--text-dark);
  min-height: 100vh;
  width: 100vw;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 0;
  transition: opacity 0.2s ease-in;
}

.template { display: none !important; }

/* ── Viewer Centering Wrapper ── */
#zoom-wrapper {
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 24px 0 32px;
}

/* ── A4 Page Card Container ── */
#cv-page {
  position: relative;
  width: 1000px;
  min-height: 1413.94px;
  background: var(--page-bg);
  color: var(--text-dark);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
  flex-shrink: 0;
  transform-origin: top center;
  font-size: calc(13px * var(--cs));
  line-height: 1.34;
}

/* ── Header Section ── */
.top-header {
  background-color: var(--banner-blue);
  color: #FFFFFF;
  padding: calc(36px * var(--cs)) calc(40px * var(--cs)) calc(28px * var(--cs)) calc(40px * var(--cs));
}

.candidate-name {
  font-size: calc(32px * var(--cs));
  font-weight: 700;
  color: #FFFFFF;
  line-height: 1.1;
  margin-bottom: calc(6px * var(--cs));
}

.candidate-tagline {
  font-size: calc(16.5px * var(--cs));
  color: #FFFFFF;
}

/* Contact Bar */
.contact-bar {
  background-color: var(--card-bg);
  padding: calc(12px * var(--cs)) calc(40px * var(--cs));
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: calc(15px * var(--cs));
  font-weight: 700;
  color: var(--banner-blue);
  margin-bottom: calc(16px * var(--cs));
  flex-wrap: wrap;
  gap: calc(10px * var(--cs));
}

.contact-item {
  display: flex;
  align-items: center;
  gap: calc(6px * var(--cs));
  color: var(--banner-blue);
}

.contact-item a {
  color: var(--banner-blue);
  text-decoration: none;
}

/* Section Banner Headings */
.section-banner {
  background-color: var(--banner-blue);
  color: var(--banner-txt);
  font-size: calc(14px * var(--cs));
  font-weight: 700;
  text-transform: uppercase;
  padding: calc(4px * var(--cs)) calc(10px * var(--cs));
  margin-top: calc(14px * var(--cs));
  margin-bottom: calc(10px * var(--cs));
  letter-spacing: 0.4px;
}

.column-left .section-banner:first-child,
.column-right .section-banner:first-child {
  margin-top: 0;
}

/* ── 2-Column Layout ── */
.main-content {
  display: grid;
  grid-template-columns: 40% 57%;
  column-gap: 3%;
  padding: 0 calc(40px * var(--cs)) calc(30px * var(--cs)) calc(40px * var(--cs));
}

/* Left Column Paragraphs & Cards */
.summary-paragraph {
  font-size: calc(12.8px * var(--cs));
  line-height: 1.38;
  color: var(--text-body);
  text-align: justify;
  margin-bottom: calc(10px * var(--cs));
}

.edu-card {
  background-color: var(--card-bg);
  padding: calc(6px * var(--cs)) calc(10px * var(--cs));
  margin-bottom: calc(8px * var(--cs));
  border-radius: 2px;
}

.edu-header-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: calc(2px * var(--cs));
}

.edu-title {
  font-size: calc(13.8px * var(--cs));
  font-weight: 700;
  color: var(--text-dark);
}

.edu-date {
  font-size: calc(12px * var(--cs));
  color: var(--text-muted);
}

.edu-inst {
  font-size: calc(12.2px * var(--cs));
  color: var(--text-muted);
  margin-bottom: calc(2px * var(--cs));
}

.edu-score-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: calc(12.2px * var(--cs));
  color: var(--text-dark);
}

.skills-block {
  font-size: calc(12.5px * var(--cs));
  line-height: 1.36;
  color: var(--text-body);
  margin-bottom: calc(8px * var(--cs));
}

.bullet-list {
  list-style-type: disc;
  padding-left: calc(16px * var(--cs));
  font-size: calc(12.5px * var(--cs));
  line-height: 1.36;
  color: var(--text-body);
  margin-bottom: calc(10px * var(--cs));
}

.bullet-list li {
  margin-bottom: calc(4px * var(--cs));
  text-align: justify;
}

.bullet-list li:last-child {
  margin-bottom: 0;
}

/* Right Column Experience & Courses */
.exp-block {
  margin-bottom: calc(12px * var(--cs));
}

.exp-role-card {
  background-color: var(--card-bg);
  padding: calc(8px * var(--cs)) calc(12px * var(--cs));
  border-radius: calc(3px * var(--cs));
  margin-top: calc(4px * var(--cs));
  margin-bottom: calc(6px * var(--cs));
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.exp-role-card-left {
  display: flex;
  flex-direction: column;
}

.exp-role-card-title {
  font-size: calc(15.5px * var(--cs));
  font-weight: 700;
  color: var(--text-dark);
  line-height: 1.2;
}

.exp-role-card-company {
  font-size: calc(13.8px * var(--cs));
  color: var(--text-muted);
  margin-top: calc(2px * var(--cs));
}

.exp-role-card-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  font-size: calc(13px * var(--cs));
  color: var(--text-body);
  line-height: 1.4;
}

.exp-card-meta-item {
  display: flex;
  align-items: center;
  gap: calc(4px * var(--cs));
}

.company-subline {
  font-size: calc(12.8px * var(--cs));
  color: var(--text-muted);
  margin-bottom: calc(4px * var(--cs));
  padding-left: calc(2px * var(--cs));
}

.company-desc {
  font-size: calc(12px * var(--cs));
  font-style: italic;
  color: var(--text-body);
  margin-bottom: calc(8px * var(--cs));
}

/* Subsection / Title Merged Display Fixes */
.experience-title-merged .exp-role-card {
  display: none !important;
}

.experience-title-merged [data-field="category"],
.subgroup-banner-title {
  font-size: calc(13.5px * var(--cs));
  font-weight: 700;
  font-style: normal !important;
  color: var(--banner-blue);
  background-color: var(--card-bg);
  padding: calc(4px * var(--cs)) calc(10px * var(--cs));
  border-radius: calc(3px * var(--cs));
  margin-top: calc(8px * var(--cs));
  margin-bottom: calc(6px * var(--cs));
  display: block;
}

.course-item {
  margin-bottom: calc(10px * var(--cs));
}

.course-title {
  font-size: calc(13.2px * var(--cs));
  font-weight: 700;
  text-decoration: underline;
  color: var(--text-dark);
  margin-bottom: calc(4px * var(--cs));
}

/* ── Print Styles (A4 Page Output) ── */
@media print {
  html, body {
    background: none !important;
    margin: 0;
    padding: 0;
  }
  #zoom-wrapper {
    padding: 0;
  }
  #cv-page {
    transform: scale(1) !important;
    margin: 0 !important;
    width: 210mm;
    min-height: 297mm;
    box-shadow: none;
  }
  @page {
    size: A4 portrait;
    margin: 0;
  }
}

</style>
</head>
<body>

  <div class="top-header">

<!-- ══ SCRIPT ENGINE ════════════════════════════════════════════ -->
<script src="cv-common.js"></script>
<script>
(function () {
  'use strict';

  const originalRenderCV = window.renderCV;
  window.renderCV = function (data) {
    if (typeof originalRenderCV === 'function') originalRenderCV(data);
    adjustExperienceSubgroups();
    requestAnimationFrame(function () {
      shrinkContentToFit();
      scaleToFit();
    });
  };

  function adjustExperienceSubgroups() {
    document.querySelectorAll('#experience-list .exp-block').forEach(function (block) {
      if (block.classList.contains('template')) return;
      const isMerged = block.classList.contains('experience-title-merged');
      const card = block.querySelector('.exp-role-card');
      const cat = block.querySelector('[data-field="category"]');

      if (isMerged) {
        if (card) card.style.display = 'none';
        if (cat) {
          const text = (cat.textContent || '').trim();
          if (text) {
            cat.style.display = 'block';
            cat.classList.add('subgroup-banner-title');
          } else {
            cat.style.display = 'none';
          }
        }
      }
    });
  }

  var PAGE_H = 1413.94; /* A4 page height limit in px */
  var PAGE_W = 1000;    /* A4 viewer width in px */

  function scaleToFit() {
    var page = document.getElementById('cv-page');
    if (!page || document.body.classList.contains('print-mode')) return;
    var avail = window.innerWidth - 20;
    var scale = avail < PAGE_W ? avail / PAGE_W : 1.0;
    page.style.transform = 'scale(' + scale + ')';
    page.style.marginBottom = '-' + (PAGE_H - PAGE_H * scale) + 'px';
  }

  function shrinkContentToFit() {
    var page = document.getElementById('cv-page');
    if (!page) return;
    var cs = 1.0;
    document.documentElement.style.setProperty('--cs', cs);
    page.style.height = 'auto';
    var iter = 0;
    while (page.scrollHeight > PAGE_H + 1 && iter < 80) {
      cs = Math.round((cs - 0.01) * 1000) / 1000;
      document.documentElement.style.setProperty('--cs', cs);
      iter++;
    }
    page.style.height = '';
  }

  window.scaleToFit = scaleToFit;
  window.shrinkContentToFit = shrinkContentToFit;

  var _tx = '', _mb = '';

  function enablePrintMode() {
    var page = document.getElementById('cv-page');
    if (!page) return;
    _tx = page.style.transform;
    _mb = page.style.marginBottom;
    document.body.classList.add('print-mode');
    page.style.transform = 'scale(1)';
    page.style.marginBottom = '0';
    shrinkContentToFit();
  }

  function disablePrintMode() {
    var page = document.getElementById('cv-page');
    if (!page) return;
    document.body.classList.remove('print-mode');
    page.style.transform = _tx || '';
    page.style.marginBottom = _mb || '';
    scaleToFit();
  }

  window.addEventListener('load', function () {
    shrinkContentToFit();
    scaleToFit();
    document.body.style.opacity = '1';
    var mq = window.matchMedia('print');
    var handler = function (e) { e.matches ? enablePrintMode() : disablePrintMode(); };
    if (mq.addEventListener) { mq.addEventListener('change', handler); }
    else if (mq.addListener)  { mq.addListener(handler); }
    window.addEventListener('beforeprint', enablePrintMode);
    window.addEventListener('afterprint',  disablePrintMode);
  });

  var _rt;
  window.addEventListener('resize', function () {
    clearTimeout(_rt);
    _rt = setTimeout(scaleToFit, 100);
  });
}());
</script>
</body>
