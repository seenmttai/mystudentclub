<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Resume - Split Banner</title>
<style>

:root {
  --accent-color:   #002060;
  --header-bg:      var(--accent-color, #262626);
  --header-txt:     #FFFFFF;
  --sub-bar-bg:     color-mix(in srgb, var(--accent-color, #002060) 12%, #EAEAEA);
  --banner-bg:      var(--accent-color, #687074);
  --banner-txt:     #FFFFFF;
  --card-bg:        color-mix(in srgb, var(--accent-color, #002060) 6%, #F4F5F6);
  --text-dark:      #333333;
  --text-muted:     #666666;
  --link-color:     var(--accent-color, #262626);
  --page-bg:        #FFFFFF;
  --viewer-bg:      #525659;
  --font-main:      'Microsoft Sans Serif', 'Segoe UI', Arial, sans-serif;
  --cs:             1.0;
}

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

body {
  background: var(--viewer-bg);
  font-family: var(--font-main);
  color: var(--text-dark);
  min-height: 100vh;
  width: 100vw;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 0;
  transition: opacity 0.2s ease-in;
}

#zoom-wrapper {
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 24px 0 32px;
}

#cv-page {
  position: relative;
  width: 1000px;
  min-height: 1413.94px;
  background: var(--page-bg);
  color: var(--text-dark);
  padding: 0 0 35px 0;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
  flex-shrink: 0;
  transform-origin: top center;
  font-size: calc(14.2px * var(--cs));
  line-height: 1.4;
}

.template { display: none !important; }

/* ── Header Section ── */
.top-header {
  background-color: var(--header-bg);
  color: var(--header-txt);
  padding: calc(24px * var(--cs)) calc(35px * var(--cs));
}

.candidate-name {
  font-size: calc(30px * var(--cs));
  font-weight: 700;
  line-height: 1.1;
  margin-bottom: calc(6px * var(--cs));
}

.candidate-tagline {
  font-size: calc(15px * var(--cs));
  line-height: 1.4;
  color: #E0E0E0;
}

/* Sub-header Contact Bar */
.contact-bar {
  background-color: var(--sub-bar-bg);
  color: var(--text-dark);
  padding: calc(8px * var(--cs)) calc(35px * var(--cs));
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: calc(14px * var(--cs));
  font-weight: 600;
  margin-bottom: calc(15px * var(--cs));
  flex-wrap: wrap;
  gap: calc(10px * var(--cs));
}

.contact-item {
  display: flex;
  align-items: center;
  gap: calc(6px * var(--cs));
}

.contact-item a {
  color: var(--text-dark);
  text-decoration: none;
}

.contact-item a:hover {
  text-decoration: underline;
}

/* ── Main Layout (2-Column Grid) ── */
.main-content {
  display: grid;
  grid-template-columns: 41% 56%;
  column-gap: 3%;
  padding: 0 calc(35px * var(--cs));
}

.sortable-section {
  margin-bottom: calc(6px * var(--cs));
}

/* Section Banner Headings */
.section-banner {
  background-color: var(--banner-bg);
  color: var(--banner-txt);
  font-size: calc(15px * var(--cs));
  font-weight: 700;
  text-transform: uppercase;
  padding: calc(4px * var(--cs)) calc(10px * var(--cs));
  margin-top: calc(8px * var(--cs));
  margin-bottom: calc(10px * var(--cs));
  letter-spacing: 0.3px;
}

.column-left .sortable-section:first-child .section-banner,
.column-right .sortable-section:first-child .section-banner {
  margin-top: 0;
}

.summary-paragraph {
  font-size: calc(13.5px * var(--cs));
  line-height: 1.4;
  color: var(--text-dark);
  text-align: justify;
  margin-bottom: calc(10px * var(--cs));
}

/* Block Cards for Education / Awards */
.card-block {
  background-color: var(--card-bg);
  padding: calc(6px * var(--cs)) calc(8px * var(--cs));
  margin-bottom: calc(10px * var(--cs));
  border-radius: 2px;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: calc(2px * var(--cs));
}

.card-title {
  font-size: calc(14.5px * var(--cs));
  font-weight: 700;
  color: var(--text-dark);
}

.card-date {
  font-size: calc(12.8px * var(--cs));
  color: var(--text-muted);
  font-weight: 400;
}

.card-subtitle {
  font-size: calc(12.8px * var(--cs));
  font-style: italic;
  color: var(--text-muted);
  margin-bottom: calc(5px * var(--cs));
}

.card-bullets {
  font-size: calc(13.2px * var(--cs));
  line-height: 1.35;
  color: var(--text-dark);
}

.card-score-row {
  margin-top: calc(4px * var(--cs));
}
.card-marks {
  display: inline-block;
  font-size: calc(12px * var(--cs));
  font-weight: 600;
  color: var(--text-dark);
  border: 1px solid #e2e8f0;
  background-color: #f8fafc;
  padding: calc(1px * var(--cs)) calc(6px * var(--cs));
  border-radius: calc(3px * var(--cs));
  margin-right: calc(6px * var(--cs));
}
.card-remarks {
  display: inline-block;
  font-size: calc(12px * var(--cs));
  font-style: italic;
  color: var(--text-muted);
}

/* Right Column Cards & Lists */
.experience-card-header {
  background-color: var(--card-bg);
  padding: calc(6px * var(--cs)) calc(10px * var(--cs));
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  font-size: calc(14.5px * var(--cs));
  margin-top: calc(8px * var(--cs));
  margin-bottom: calc(2px * var(--cs));
}

.exp-item {
  margin-bottom: calc(12px * var(--cs));
}

.company-subline {
  font-size: calc(13.2px * var(--cs));
  font-style: italic;
  color: var(--text-muted);
  margin-bottom: calc(3px * var(--cs));
  padding-left: calc(2px * var(--cs));
}

.company-desc {
  font-size: calc(12.8px * var(--cs));
  font-style: italic;
  color: var(--text-muted);
  margin-bottom: calc(6px * var(--cs));
  padding-left: calc(2px * var(--cs));
}

.right-bullet-list {
  list-style-type: disc;
  padding-left: calc(18px * var(--cs));
  font-size: calc(13.5px * var(--cs));
  line-height: 1.4;
  color: var(--text-dark);
  margin-bottom: calc(10px * var(--cs));
}

.right-bullet-list li {
  margin-bottom: calc(5px * var(--cs));
  text-align: justify;
}

.right-bullet-list li:last-child {
  margin-bottom: 0;
}

.skills-text {
  font-size: calc(14.5px * var(--cs));
  line-height: 1.4;
  color: var(--text-dark);
}

@media print {
  html, body {
    background: none !important;
    margin: 0;
    padding: 0;
  }
  #zoom-wrapper {
    padding: 0;
  }
  #cv-page {
    transform: scale(1) !important;
    margin: 0 !important;
    width: 210mm;
    min-height: 297mm;
    box-shadow: none;
    padding: 0 0 10mm 0;
  }
  @page {
    size: A4 portrait;
    margin: 0;
  }
}
</style>
</head>
<body>
<div id="zoom-wrapper">
<div id="cv-page">

  <!-- ══ HEADER SECTION ══════════════════════════════════════════ -->
  <div class="top-header">
    <h1 class="candidate-name" data-field="name">Padam Bhansali</h1>
    <div class="candidate-tagline" data-field="tagline">Chartered Accountant | Financial Analyst</div>
  </div>

  <!-- Sub-header Contact Bar -->
  <div class="contact-bar contact-block">
    <div class="contact-item contact-row">
      <span class="contact-value" data-field="phone">+91 7228881182</span>
    </div>
    <div class="contact-item contact-row">
      <span>✉</span> <a href="#" class="contact-value" data-field="email">capadambhansali@gmail.com</a>
    </div>
    <div class="contact-item contact-row">
      <span>🔗</span> <a href="#" target="_blank" rel="noopener" class="contact-value" data-field="linkedin">linkedin.com/in/ca-padam-bhansali</a>
    </div>
    <div class="contact-item contact-row">
      <span class="contact-value" data-field="location">Mumbai</span>
    </div>
  </div>

  <!-- ══ MAIN 2-COLUMN CONTENT ══════════════════════════════════ -->
  <div class="main-content">

    <!-- ── LEFT COLUMN ── -->
    <div class="column-left">

      <div class="sortable-section" data-section-id="summary">
        <div class="section-banner">Summary</div>
        <p class="summary-paragraph" data-field="summary"></p>
      </div>

      <div class="sortable-section" data-section-id="education">
        <div class="section-banner">Education</div>
        <div id="education-list">
          <div class="card-block template">
            <div class="card-header">
              <span class="card-title" data-field="degree"></span>
              <span class="card-date" data-field="year"></span>
            </div>
            <div data-field="institution-header">
              <div class="card-subtitle" data-field="institution"></div>
            </div>
            <div class="card-score-row">
              <span class="card-marks" data-field="marks"></span>
              <span class="card-remarks" data-field="remarks"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="sortable-section" data-section-id="certifications">
        <div class="section-banner">Certifications & Awards</div>
        <ul class="right-bullet-list" id="cert-list" data-list="certifications"></ul>
      </div>

      <div class="sortable-section" data-section-id="achievements">
        <div class="section-banner">Achievements</div>
        <ul class="right-bullet-list" data-list="achievements"></ul>
      </div>

    </div>

    <!-- ── RIGHT COLUMN ── -->
    <div class="column-right" data-section-append-host>

      <div class="sortable-section" data-section-id="experience">
        <div class="section-banner">Experience</div>
        <div id="experience-list">
          <div class="exp-item template">
            <div class="experience-card-header">
              <span data-field="role"></span>
              <span data-field="dates"></span>
            </div>
            <div class="company-subline" data-field="company"></div>
            <div class="company-desc" data-field="category"></div>
            <div class="company-desc" data-field="intro"></div>
            <ul class="right-bullet-list" data-list="bullets"></ul>
          </div>
        </div>
      </div>

      <div class="sortable-section" data-section-id="projects">
        <div class="section-banner">Projects</div>
        <div id="projects-list">
          <div class="exp-item template">
            <div class="experience-card-header">
              <span data-field="title"></span>
            </div>
            <div class="company-desc" data-field="description"></div>
            <ul class="right-bullet-list" data-list="bullets"></ul>
          </div>
        </div>
      </div>

      <div class="sortable-section" data-section-id="skills">
        <div class="section-banner">Skills</div>
        <div class="skills-text" data-field="skills"></div>
      </div>

      <div class="sortable-section" data-section-id="leadership">
        <div class="section-banner">Leadership</div>
        <ul class="right-bullet-list" data-list="leadership"></ul>
      </div>

      <div class="sortable-section" data-section-id="interests">
        <div class="section-banner">Interests</div>
        <ul class="right-bullet-list" data-list="interests"></ul>
      </div>

    </div>

  </div><!-- .main-content -->

</div><!-- #cv-page -->
</div><!-- #zoom-wrapper -->

<script src="cv-common.js"></script>
<script>
(function () {
  'use strict';

  var PAGE_H = 1413.94;
  var PAGE_W = 1000;

  function scaleToFit() {
    var page = document.getElementById('cv-page');
    if (!page || document.body.classList.contains('print-mode')) return;
    var avail = window.innerWidth - 20;
    var scale = avail < PAGE_W ? avail / PAGE_W : 1.0;
    page.style.transform = 'scale(' + scale + ')';
    page.style.marginBottom = '-' + (PAGE_H - PAGE_H * scale) + 'px';
  }

  function shrinkContentToFit() {
    var page = document.getElementById('cv-page');
    if (!page) return;
    var cs = 1.0;
    document.documentElement.style.setProperty('--cs', cs);
    page.style.height = 'auto';
    var iter = 0;
    while (page.scrollHeight > PAGE_H + 1 && iter < 80) {
      cs = Math.round((cs - 0.01) * 1000) / 1000;
      document.documentElement.style.setProperty('--cs', cs);
      iter++;
    }
    page.style.height = '';
  }

  window.scaleToFit = scaleToFit;
  window.shrinkContentToFit = shrinkContentToFit;

  var _tx = '', _mb = '';

  function enablePrintMode() {
    var page = document.getElementById('cv-page');
    if (!page) return;
    _tx = page.style.transform;
    _mb = page.style.marginBottom;
    document.body.classList.add('print-mode');
    page.style.transform = 'scale(1)';
    page.style.marginBottom = '0';
    shrinkContentToFit();
  }

  function disablePrintMode() {
    var page = document.getElementById('cv-page');
    if (!page) return;
    document.body.classList.remove('print-mode');
    page.style.transform = _tx || '';
    page.style.marginBottom = _mb || '';
    scaleToFit();
  }

  window.addEventListener('load', function () {
    shrinkContentToFit();
    scaleToFit();
    document.body.style.opacity = '1';
    var mq = window.matchMedia('print');
    var handler = function (e) { e.matches ? enablePrintMode() : disablePrintMode(); };
    if (mq.addEventListener) { mq.addEventListener('change', handler); }
    else if (mq.addListener)  { mq.addListener(handler); }
    window.addEventListener('beforeprint', enablePrintMode);
    window.addEventListener('afterprint',  disablePrintMode);
  });

  var _rt;
  window.addEventListener('resize', function () {
    clearTimeout(_rt);
    _rt = setTimeout(scaleToFit, 100);
  });
}());
</script>
</body>
</html>
