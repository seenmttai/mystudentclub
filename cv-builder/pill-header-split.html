<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pill Header Split CV</title>
<style>

:root {
  --navy-pill:     var(--accent-color, #0B2046);   /* Dark Pill Banner Color */
  --sidebar-bg:    color-mix(in srgb, var(--accent-color, #0B2046) 8%, #F4F4F4);   /* Dynamic Soft Sidebar Background */
  --text-dark:     #1C1C1C;   /* Dark Charcoal Text */
  --border-navy:   var(--accent-color, #0B2046);   /* Dark Border Line */
  --link-blue:     var(--accent-color, #0056B3);   /* Dynamic Link Blue */
  --page-bg:       #FFFFFF;   /* White A4 Sheet */
  --viewer-bg:     #525659;   /* Outer Canvas Background */
  --font-serif:    Cambria, Georgia, serif;
  --font-heading:  'Times New Roman', Times, serif;
  --cs:            1.0;       /* Content scale variable adjusted by shrinkContentToFit() */
}

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

body {
  background: var(--viewer-bg);
  font-family: var(--font-serif);
  color: var(--text-dark);
  min-height: 100vh;
  width: 100vw;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 0;
  transition: opacity 0.2s ease-in;
}

.template { display: none !important; }

/* ── Viewer Centering Wrapper ── */
#zoom-wrapper {
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 24px 0 32px;
}

/* ── A4 Page Card Container with Outer Border ── */
#cv-page {
  position: relative;
  width: 1000px;
  min-height: 1413.94px;
  background: var(--page-bg);
  color: var(--text-dark);
  border: 2px solid #1f1f1f;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
  flex-shrink: 0;
  transform-origin: top center;
  font-size: calc(14.5px * var(--cs));
  line-height: 1.4;
  display: flex;
}

/* ── 2-Column Split Layout ── */
.left-panel {
  width: 33%;
  background-color: var(--sidebar-bg);
  border-right: calc(1.5px * var(--cs)) solid var(--border-navy);
  padding: calc(24px * var(--cs)) calc(16px * var(--cs));
  box-sizing: border-box;
}

.right-panel {
  width: 67%;
  background-color: var(--page-bg);
  padding: calc(24px * var(--cs)) calc(22px * var(--cs));
  box-sizing: border-box;
}

/* Candidate Name */
.candidate-name {
  font-family: var(--font-serif);
  font-size: calc(28px * var(--cs));
  font-weight: 400;
  color: var(--text-dark);
  line-height: 1.15;
  margin-bottom: calc(14px * var(--cs));
}

.candidate-tagline {
  font-family: var(--font-heading);
  font-size: calc(15px * var(--cs));
  font-weight: 700;
  color: var(--navy-pill);
  margin-bottom: calc(8px * var(--cs));
}

/* Pill Banners */
.pill-banner {
  display: inline-block;
  background-color: var(--navy-pill);
  color: #FFFFFF;
  font-family: var(--font-heading);
  font-size: calc(14.8px * var(--cs));
  font-weight: 700;
  text-transform: uppercase;
  padding: calc(3px * var(--cs)) calc(18px * var(--cs));
  border-radius: calc(5px * var(--cs));
  margin-top: calc(14px * var(--cs));
  margin-bottom: calc(8px * var(--cs));
  letter-spacing: 0.5px;
}

.left-panel .pill-banner:first-child,
.right-panel .pill-banner:first-child {
  margin-top: 0;
}

/* Left Panel Details Contact List */
.details-list {
  font-size: calc(14px * var(--cs));
  line-height: 1.4;
  margin-bottom: calc(12px * var(--cs));
}

.details-item {
  display: flex !important;
  align-items: center;
  gap: calc(6px * var(--cs));
  margin-bottom: calc(4px * var(--cs));
}

.details-item a,
.contact-value a {
  color: var(--link-blue);
  word-break: break-all;
  text-decoration: none !important;
  border-bottom: none !important;
}

/* Custom Section Title Pill Headers */
.sortable-section .section-title {
  display: inline-block;
  background-color: var(--navy-pill);
  color: #FFFFFF;
  font-family: var(--font-heading);
  font-size: calc(14.8px * var(--cs));
  font-weight: 700;
  text-transform: uppercase;
  padding: calc(4px * var(--cs)) calc(18px * var(--cs));
  border-radius: calc(5px * var(--cs));
  letter-spacing: 0.5px;
  margin-top: calc(14px * var(--cs));
  margin-bottom: calc(8px * var(--cs));
  position: relative;
  z-index: 2;
}

.details-list .contact-value .contact-icon-glyph,
.details-list .contact-value > .contact-icon-item > .contact-icon-glyph {
  display: none !important;
}

.details-list .contact-sep {
  display: none !important;
}

/* Left Panel Technical & Other Skills */
.skills-text {
  font-size: calc(14px * var(--cs));
  line-height: 1.4;
  margin-bottom: calc(12px * var(--cs));
}

.skill-heading {
  font-family: var(--font-heading);
  font-size: calc(14.5px * var(--cs));
  font-weight: 700;
  text-decoration: underline;
  color: var(--text-dark);
  margin-top: calc(6px * var(--cs));
  margin-bottom: calc(6px * var(--cs));
}

.left-bullet-list {
  list-style: none;
  padding-left: 0;
  font-size: calc(14px * var(--cs));
  line-height: 1.4;
  margin-bottom: calc(12px * var(--cs));
}

.left-bullet-list li {
  position: relative;
  padding-left: calc(12px * var(--cs));
  margin-bottom: calc(5px * var(--cs));
  text-align: justify;
}

.left-bullet-list li::before {
  content: "•";
  position: absolute;
  left: 0;
  color: var(--text-dark);
  font-size: calc(14.5px * var(--cs));
  line-height: 1;
}

/* Right Panel Styles */
.summary-text {
  font-size: calc(13.6px * var(--cs));
  line-height: 1.4;
  color: var(--text-dark);
  text-align: justify;
  margin-bottom: calc(12px * var(--cs));
}

.edu-bullet-list {
  list-style: none;
  padding-left: 0;
  font-size: calc(13.4px * var(--cs));
  line-height: 1.4;
  margin-bottom: calc(12px * var(--cs));
}

.edu-bullet-list li {
  position: relative;
  padding-left: calc(14px * var(--cs));
  margin-bottom: calc(5px * var(--cs));
}

.edu-bullet-list li::before {
  content: "•";
  position: absolute;
  left: 0;
  color: var(--text-dark);
}

.exp-block {
  margin-bottom: calc(10px * var(--cs));
}

.exp-role-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: calc(6px * var(--cs));
  margin-bottom: calc(2px * var(--cs));
}

.exp-role-title {
  font-family: var(--font-heading);
  font-size: calc(15.2px * var(--cs));
  font-weight: 700;
  text-decoration: underline;
}

.exp-date {
  font-size: calc(14px * var(--cs));
  font-weight: 700;
}

.company-name {
  font-family: var(--font-heading);
  font-size: calc(14px * var(--cs));
  font-weight: 700;
}

.company-desc {
  font-size: calc(12.2px * var(--cs));
  font-style: italic;
  margin-bottom: calc(6px * var(--cs));
}

.right-bullet-list {
  list-style: none;
  padding-left: 0;
  font-size: calc(14px * var(--cs));
  line-height: 1.38;
  margin-bottom: calc(12px * var(--cs));
}

.right-bullet-list li {
  position: relative;
  padding-left: calc(14px * var(--cs));
  margin-bottom: calc(4px * var(--cs));
  text-align: justify;
}

.right-bullet-list li::before {
  content: "•";
  position: absolute;
  left: 0;
  color: var(--text-dark);
}

.sub-arrow-list {
  list-style: none;
  padding-left: calc(18px * var(--cs));
  margin-top: calc(2px * var(--cs));
  margin-bottom: calc(4px * var(--cs));
}

.sub-arrow-list li {
  position: relative;
  padding-left: calc(14px * var(--cs));
  margin-bottom: calc(2px * var(--cs));
}

.sub-arrow-list li::before {
  content: "➢";
  position: absolute;
  left: 0;
  font-size: calc(11px * var(--cs));
}

.roles-resp-block {
  margin-top: calc(4px * var(--cs));
  margin-bottom: calc(6px * var(--cs));
  font-size: calc(14px * var(--cs));
  line-height: 1.38;
  text-align: justify;
}

/* ── Print Styles (A4 Page Output) ── */
@media print {
  html, body {
    background: none !important;
    margin: 0;
    padding: 0;
  }
  #zoom-wrapper {
    padding: 0;
  }
  #cv-page {
    transform: scale(1) !important;
    margin: 0 !important;
    width: 210mm;
    min-height: 297mm;
    box-shadow: none;
    border: none;
  }
  @page {
    size: A4 portrait;
    margin: 0;
  }
}

/* Pill Banner Header Row */
.pill-banner-row {
  display: flex;
  align-items: flex-end;
  margin-top: calc(14px * var(--cs));
  margin-bottom: calc(8px * var(--cs));
  position: relative;
}

.left-panel .pill-banner-row:first-child,
.right-panel .pill-banner-row:first-child {
  margin-top: 0;
}

.pill-banner-row .pill-banner {
  display: inline-block;
  background-color: var(--navy-pill);
  color: #FFFFFF;
  font-family: var(--font-heading);
  font-size: calc(14.8px * var(--cs));
  font-weight: 700;
  text-transform: uppercase;
  padding: calc(4px * var(--cs)) calc(18px * var(--cs));
  border-radius: calc(5px * var(--cs));
  letter-spacing: 0.5px;
  margin: 0;
  flex-shrink: 0;
  position: relative;
  z-index: 2;
}

.pill-line {
  flex-grow: 1;
  height: calc(1.5px * var(--cs));
  background-color: var(--navy-pill);
  margin-left: calc(-8px * var(--cs));
  margin-bottom: 0;
  position: relative;
  z-index: 1;
}

.left-panel .pill-line {
  margin-right: calc(-16px * var(--cs));
}

.right-panel .pill-line {
  margin-right: calc(-22px * var(--cs));
}

.name-divider {
  height: calc(1.5px * var(--cs));
  background-color: var(--navy-pill);
  margin-top: calc(10px * var(--cs));
  margin-bottom: calc(10px * var(--cs));
  margin-left: calc(-16px * var(--cs));
  margin-right: calc(-16px * var(--cs));
}

</style>
</head>
<body>
<div id="zoom-wrapper">
<div id="cv-page">

  <!-- ══ LEFT SIDEBAR PANEL ══════════════════════════════════════ -->
  <div class="left-panel">

    <h1 class="candidate-name" data-field="name">Padam<br>Bhansali</h1>
    <div class="candidate-tagline" data-field="tagline"></div>
    <div class="name-divider"></div>

    <div class="sortable-section" data-section-id="personal">
      <div class="pill-banner-row"><div class="pill-banner">CONTACT DETAILS</div><div class="pill-line"></div></div>
      <div class="details-list">
        <div class="details-item contact-row" data-field="phone-wrap">

        </div>
      </div>
    </div>

    <div class="sortable-section" data-section-id="skills">
      <div class="pill-banner-row"><div class="pill-banner">TECHNICAL SKILLS</div><div class="pill-line"></div></div>

    </div>

    <div class="sortable-section" data-section-id="achievements">
      <div class="pill-banner-row"><div class="pill-banner">ACHIEVEMENTS</div><div class="pill-line"></div></div>

  <div class="right-panel" data-section-append-host>

          <div class="exp-role-row">
            <span class="exp-role-title" data-field="title"></span>

    <div class="sortable-section" data-section-id="leadership">
      <div class="pill-banner-row"><div class="pill-banner">LEADERSHIP</div><div class="pill-line"></div></div>

    <div class="sortable-section" data-section-id="interests">
      <div class="pill-banner-row"><div class="pill-banner">INTERESTS</div><div class="pill-line"></div></div>

  </div><!-- .right-panel -->

</div><!-- #cv-page -->
</div><!-- #zoom-wrapper -->

<!-- ══ SCRIPT ENGINE ════════════════════════════════════════════ -->
<script src="cv-common.js"></script>
<script>
(function () {
  'use strict';

  const originalRenderCV = window.renderCV;
  window.renderCV = function (data) {
    if (typeof originalRenderCV === 'function') originalRenderCV(data);
    formatCustomSectionHeaders(data);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        shrinkContentToFit();
        scaleToFit();
      });
    });
  };

  function formatCustomSectionHeaders(data) {
    (data.customSections || []).forEach(function (section) {
      if (!section) return;
      var wrapper = document.querySelector('[data-custom-section-root="' + section.id + '"]');
      if (!wrapper) return;

      var titleText = (section.title || 'Custom Section').toUpperCase();

      var existingRow = wrapper.querySelector('.pill-banner-row');
      if (existingRow) {
        var banner = existingRow.querySelector('.pill-banner');
        if (banner) banner.textContent = titleText;
        return;
      }

      var titleEl = wrapper.querySelector('.section-title, .section-header, .section-banner, h2, h3');
      if (titleEl) titleEl.remove();

      var row = document.createElement('div');
      row.className = 'pill-banner-row';

      var pill = document.createElement('div');
      pill.className = 'pill-banner';
      pill.textContent = titleText;

      var line = document.createElement('div');
      line.className = 'pill-line';

      row.appendChild(pill);
      row.appendChild(line);

      wrapper.insertBefore(row, wrapper.firstChild);
    });
  }

  var PAGE_H = 1413.94; /* A4 page height limit in px */
  var PAGE_W = 1000;    /* A4 viewer width in px */

  function scaleToFit() {
    var page = document.getElementById('cv-page');
    if (!page || document.body.classList.contains('print-mode')) return;
    var avail = window.innerWidth - 20;
    var scale = avail < PAGE_W ? avail / PAGE_W : 1.0;
    page.style.transform = 'scale(' + scale + ')';
    page.style.marginBottom = '-' + (PAGE_H - PAGE_H * scale) + 'px';
  }

  function shrinkContentToFit() {
    var page = document.getElementById('cv-page');
    if (!page) return;
    var cs = 1.0;
    document.documentElement.style.setProperty('--cs', cs);
    page.style.height = 'auto';
    var iter = 0;
    while (page.scrollHeight > PAGE_H + 1 && iter < 80) {
      cs = Math.round((cs - 0.01) * 1000) / 1000;
      document.documentElement.style.setProperty('--cs', cs);
      iter++;
    }
    page.style.height = '';
  }

  window.scaleToFit = scaleToFit;
  window.shrinkContentToFit = shrinkContentToFit;

  var _tx = '', _mb = '';

  function enablePrintMode() {
    var page = document.getElementById('cv-page');
    if (!page) return;
    _tx = page.style.transform;
    _mb = page.style.marginBottom;
    document.body.classList.add('print-mode');
    page.style.transform = 'scale(1)';
    page.style.marginBottom = '0';
    shrinkContentToFit();
  }

  function disablePrintMode() {
    var page = document.getElementById('cv-page');
    if (!page) return;
    document.body.classList.remove('print-mode');
    page.style.transform = _tx || '';
    page.style.marginBottom = _mb || '';
    scaleToFit();
  }

  window.addEventListener('load', function () {
    shrinkContentToFit();
    scaleToFit();
    document.body.style.opacity = '1';
    var mq = window.matchMedia('print');
    var handler = function (e) { e.matches ? enablePrintMode() : disablePrintMode(); };
    if (mq.addEventListener) { mq.addEventListener('change', handler); }
    else if (mq.addListener)  { mq.addListener(handler); }
    window.addEventListener('beforeprint', enablePrintMode);
    window.addEventListener('afterprint',  disablePrintMode);
  });

  var _rt = null;
  window.addEventListener('resize', function () {
    if (_rt) clearTimeout(_rt);
    _rt = setTimeout(function () {
      scaleToFit();
    }, 100);
  });
})();
</script>
</body>
</html>
