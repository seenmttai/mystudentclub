<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sidebar Panel Split CV</title>
<style>
/* ═══════════════════════════════════════════════════════════
   DESIGN SYSTEM & ENGINE TOKENS — Sidebar Panel Split
   Page: A4 (1000 px base viewer width × 1413.94 px height)
   Scaling Engine:
     - --cs (content-scale factor): shrinkContentToFit() dynamically
       adjusts --cs so all content fits strictly within 1413.94 px (A4 1-page limit).
     - scaleToFit(): viewport responsive scaling using transform: scale().
 ═══════════════════════════════════════════════════════════ */

:root {
  --steel-blue:    var(--accent-color, #004B87);   /* Accent for Section Titles */
  --sidebar-bg:    color-mix(in srgb, var(--accent-color, #004B87) 12%, #FFFFFF);   /* Dynamic Soft Sidebar Panel Fill */
  --tag-bg:        #FFFFFF;   /* Pure White Pill Tag Chips */
  --text-dark:     #111111;   /* Primary Headings & Bold Text */
  --text-body:     #333333;   /* Body Paragraphs & Bullet Points */
  --text-muted:    #555555;   /* Secondary Muted Text */
  --link-blue:     var(--accent-color, #004B87);   /* Dynamic Link Blue */
  --page-bg:       #FFFFFF;   /* White A4 Sheet */
  --viewer-bg:     #525659;   /* Outer Canvas Background */
  --font-main:     Arial, 'Segoe UI', sans-serif;
  --cs:            1.0;       /* Content scale variable adjusted by shrinkContentToFit() */
}

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

body {
  background: var(--viewer-bg);
  font-family: var(--font-main);
  color: var(--text-dark);
  min-height: 100vh;
  width: 100vw;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 0;
  transition: opacity 0.2s ease-in;
}

.template { display: none !important; }

/* ── Viewer Centering Wrapper ── */
#zoom-wrapper {
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 24px 0 32px;
}

/* ── A4 Page Card Container ── */
#cv-page {
  position: relative;
  width: 1000px;
  min-height: 1413.94px;
  background: var(--page-bg);
  color: var(--text-dark);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
  flex-shrink: 0;
  transform-origin: top center;
  font-size: calc(14px * var(--cs));
  line-height: 1.34;
  display: flex;
}

/* ── 2-Column Split Layout ── */
.left-panel {
  width: 36%;
  background-color: var(--sidebar-bg);
  padding: calc(16px * var(--cs)) calc(14px * var(--cs));
  box-sizing: border-box;
  border-radius: calc(12px * var(--cs));
  margin: calc(20px * var(--cs)) 0 calc(20px * var(--cs)) calc(20px * var(--cs));
}

.right-panel {
  width: 64%;
  background-color: var(--page-bg);
  padding: calc(36px * var(--cs)) calc(24px * var(--cs)) calc(20px * var(--cs)) calc(24px * var(--cs));
  box-sizing: border-box;
}

/* Section Title Underlined Accent */
.section-title {
  font-size: calc(15.5px * var(--cs));
  font-weight: 700;
  color: var(--steel-blue);
  text-transform: uppercase;
  border-bottom: calc(1.8px * var(--cs)) solid #000000;
  padding-bottom: calc(3px * var(--cs));
  margin-top: calc(14px * var(--cs));
  margin-bottom: calc(10px * var(--cs));
  letter-spacing: 0.3px;
}

.left-panel .section-title:first-child,
.right-panel .section-title:first-child {
  margin-top: 0;
}

/* Left Panel Education Blocks */
.edu-block {
  margin-bottom: calc(8px * var(--cs));
}

.edu-header-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: calc(1px * var(--cs));
}

.edu-title {
  font-size: calc(14.8px * var(--cs));
  font-weight: 700;
  color: var(--text-dark);
}

.edu-date {
  font-size: calc(12px * var(--cs));
  color: var(--text-muted);
}

.edu-inst-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: calc(13.2px * var(--cs));
  color: var(--text-muted);
  margin-bottom: calc(1px * var(--cs));
}

.edu-score {
  font-size: calc(13.2px * var(--cs));
  color: var(--text-body);
}

/* Skill Tags */
.skill-category {
  font-size: calc(14.2px * var(--cs));
  font-weight: 700;
  color: var(--text-dark);
  margin-top: calc(8px * var(--cs));
  margin-bottom: calc(6px * var(--cs));
}

.tag-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: calc(6px * var(--cs));
  margin-bottom: calc(8px * var(--cs));
}

.tag-chip {
  background-color: #FFFFFF;
  color: var(--steel-blue);
  font-size: calc(13px * var(--cs));
  padding: calc(4px * var(--cs)) calc(10px * var(--cs));
  border-radius: calc(4px * var(--cs));
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}

.skills-block {
  font-size: calc(13px * var(--cs));
  line-height: 1.38;
  color: var(--text-body);
  margin-bottom: calc(10px * var(--cs));
}

/* Right Panel Candidate Header */
.candidate-name {
  font-size: calc(36px * var(--cs));
  font-weight: 700;
  color: #000000;
  line-height: 1.1;
  margin-bottom: calc(10px * var(--cs));
}

.candidate-name [data-field="name"] {
  font-size: calc(36px * var(--cs));
  font-weight: 700;
  color: #000000;
}

.candidate-name [data-field="tagline"] {
  font-weight: 400;
  color: #62666A;
  font-size: calc(20px * var(--cs));
}

.summary-paragraph {
  font-size: calc(12.8px * var(--cs));
  line-height: 1.38;
  color: var(--text-body);
  text-align: justify;
  margin-bottom: calc(10px * var(--cs));
}

.contact-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: calc(14px * var(--cs));
  font-size: calc(12.5px * var(--cs));
  color: var(--text-dark);
  margin-bottom: calc(14px * var(--cs));
}

.contact-item {
  display: flex;
  align-items: center;
  gap: calc(4px * var(--cs));
}

.contact-item a {
  color: var(--text-dark);
  text-decoration: none;
}

/* Experience Block */
.exp-block {
  margin-bottom: calc(10px * var(--cs));
}

.exp-header-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: calc(1px * var(--cs));
}

.exp-title {
  font-size: calc(15.5px * var(--cs));
  font-weight: 700;
  color: var(--text-dark);
}

.exp-date {
  font-size: calc(12px * var(--cs));
  color: var(--text-muted);
}

.exp-company-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: calc(12.5px * var(--cs));
  color: var(--text-muted);
  margin-bottom: calc(6px * var(--cs));
}

.company-desc {
  font-size: calc(12px * var(--cs));
  font-style: italic;
  color: var(--text-body);
  margin-bottom: calc(6px * var(--cs));
}

.subgroup-title {
  font-size: calc(14px * var(--cs));
  font-weight: 700;
  color: var(--text-dark);
  margin-top: calc(6px * var(--cs));
  margin-bottom: calc(4px * var(--cs));
}

.bullet-list {
  list-style-type: disc;
  padding-left: calc(16px * var(--cs));
  font-size: calc(12.5px * var(--cs));
  line-height: 1.36;
  color: var(--text-body);
  margin-bottom: calc(6px * var(--cs));
}

.bullet-list li {
  margin-bottom: calc(3px * var(--cs));
  text-align: justify;
}

.bullet-list li:last-child {
  margin-bottom: 0;
}

/* ── Print Styles (A4 Page Output) ── */
@media print {
  html, body {
    background: none !important;
    margin: 0;
    padding: 0;
  }
  #zoom-wrapper {
    padding: 0;
  }
  #cv-page {
    transform: scale(1) !important;
    margin: 0 !important;
    width: 210mm;
    min-height: 297mm;
    box-shadow: none;
  }
  @page {
    size: A4 portrait;
    margin: 0;
  }
}
</style>
</head>
<body>

<!-- ══ SCRIPT ENGINE ════════════════════════════════════════════ -->
<script src="cv-common.js"></script>
<script>
(function () {
  'use strict';

  var PAGE_H = 1413.94; /* A4 page height limit in px */
  var PAGE_W = 1000;    /* A4 viewer width in px */

  function scaleToFit() {
    var page = document.getElementById('cv-page');
    if (!page || document.body.classList.contains('print-mode')) return;
    var avail = window.innerWidth - 20;
    var scale = avail < PAGE_W ? avail / PAGE_W : 1.0;
    page.style.transform = 'scale(' + scale + ')';
    page.style.marginBottom = '-' + (PAGE_H - PAGE_H * scale) + 'px';
  }

  function shrinkContentToFit() {
    var page = document.getElementById('cv-page');
    if (!page) return;
    var cs = 1.0;
    document.documentElement.style.setProperty('--cs', cs);
    page.style.height = 'auto';
    var iter = 0;
    while (page.scrollHeight > PAGE_H + 1 && iter < 80) {
      cs = Math.round((cs - 0.01) * 1000) / 1000;
      document.documentElement.style.setProperty('--cs', cs);
      iter++;
    }
    page.style.height = '';
  }

  window.scaleToFit = scaleToFit;
  window.shrinkContentToFit = shrinkContentToFit;

  var _tx = '', _mb = '';

  function enablePrintMode() {
    var page = document.getElementById('cv-page');
    if (!page) return;
    _tx = page.style.transform;
    _mb = page.style.marginBottom;
    document.body.classList.add('print-mode');
    page.style.transform = 'scale(1)';
    page.style.marginBottom = '0';
    shrinkContentToFit();
  }

  function disablePrintMode() {
    var page = document.getElementById('cv-page');
    if (!page) return;
    document.body.classList.remove('print-mode');
    page.style.transform = _tx || '';
    page.style.marginBottom = _mb || '';
    scaleToFit();
  }

  window.addEventListener('load', function () {
    shrinkContentToFit();
    scaleToFit();
    document.body.style.opacity = '1';
    var mq = window.matchMedia('print');
    var handler = function (e) { e.matches ? enablePrintMode() : disablePrintMode(); };
    if (mq.addEventListener) { mq.addEventListener('change', handler); }
    else if (mq.addListener)  { mq.addListener(handler); }
    window.addEventListener('beforeprint', enablePrintMode);
    window.addEventListener('afterprint',  disablePrintMode);
  });

  var _rt;
  window.addEventListener('resize', function () {
    clearTimeout(_rt);
    _rt = setTimeout(scaleToFit, 100);
  });
}());
</script>
