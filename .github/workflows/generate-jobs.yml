name: Generate Jobs

on:
  schedule:
    - cron: '0 */3 * * *' # Run every 3 hours
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Astro Dependencies
      run: cd jobs-builder && npm install
      
    - name: Build Job Pages (Astro, every job from the last 15 days)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: cd jobs-builder && npx astro build

    # Copies the built pages into jobs/, redirects old URLs of live jobs to their
    # current URL and deletes pages of expired or removed jobs.
    - name: Sync Job Pages
      run: cd jobs-builder && npm run sync

    - name: Generate Sitemap
      run: cd jobs-builder && npm run sitemap

    - name: Notify Google Indexing API
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: cd jobs-builder && npm run index

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add -A jobs/ jobs-sitemap.xml
        if ! git diff --staged --quiet; then
          git commit -m "Auto-generated jobs update (Astro SSG)"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
        else
          echo "No changes to commit"
        fi

