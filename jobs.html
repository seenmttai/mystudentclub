<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacancy - My Student Club</title>
    <meta name="description" content="A CA vacancy on My Student Club: role, company, location, pay and how to apply.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/scripts/portal-v2/portal-v2.css?v=1">
    <link rel="preconnect" href="https://auth.mystudentclub.com" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/scripts/supabase-init.js"></script>
    <style>
        body {
            margin: 0;
            background: var(--pv2-bg);
            font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .jd-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--pv2-line);
        }

        .jd-header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 860px;
            margin: 0 auto;
            padding: 12px 16px;
        }

        .jd-header img {
            display: block;
            height: 33px;
            width: auto;
        }

        .jd-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--pv2-navy);
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
        }

        .jd-back:hover {
            color: var(--pv2-blue);
        }

        .jd-main {
            max-width: 860px;
            margin: 0 auto;
            padding: 20px 16px 48px;
        }

        .jd-card {
            background: var(--pv2-surface);
            border: 1px solid var(--pv2-line);
            border-radius: 16px;
            box-shadow: var(--pv2-shadow-sm);
            padding: 24px;
        }

        .jd-card[hidden] {
            display: none;
        }

        @media (max-width: 640px) {
            .jd-card {
                padding: 16px;
            }

            .jd-header img {
                height: 29px;
            }
        }
    </style>
    <link rel="icon" href="https://www.mystudentclub.com/favicon.png" sizes="192x192" type="image/png">
    <link rel="shortcut icon" href="https://www.mystudentclub.com/favicon.ico">
    <link rel="apple-touch-icon" href="https://www.mystudentclub.com/assets/icon-70x70.png">
</head>

<body>
    <header class="jd-header">
        <div class="jd-header-inner">
            <a href="/" aria-label="My Student Club home"><img src="/assets/logo.png" alt="My Student Club" width="167" height="33"></a>
            <a href="/" class="jd-back" id="backLink"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> <span id="backLinkText">All vacancies</span></a>
        </div>
    </header>

    <main class="jd-main">
        <div id="loadingState" class="jd-card" aria-busy="true">
            <div class="pv2-card pv2-skeleton" aria-hidden="true" style="box-shadow:none;border:0;padding:0"><span class="pv2-logo pv2-logo-lg"></span><div class="pv2-card-body"><span class="pv2-sk pv2-sk-title"></span><span class="pv2-sk pv2-sk-line"></span><span class="pv2-sk pv2-sk-meta"></span></div></div>
            <span class="pv2-sk" style="height:120px;margin-top:24px"></span>
            <span class="pv2-sk pv2-sk-meta" style="margin-top:24px"></span>
            <span class="pv2-sk pv2-sk-line"></span>
        </div>
        <div id="jobDetailsContainer" class="jd-card" hidden></div>
    </main>

    <script src="/scripts/profile-state.js?v=1"></script>
    <script type="module" src="/scripts/job-details.js?v=3.0"></script>
    <script src="https://www.googletagmanager.com/gtag/js?id=G-1450NCVE65" async></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-1450NCVE65');
    </script>
</body>

</html>
