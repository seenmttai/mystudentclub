<!doctype html>
<html lang="en-IN" class="ap-gated">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Written test practice | My Student Club</title>
<meta name="description" content="Timed practice papers for the written test many firms hold before the interview: sit, see your score by section, read every reason.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/articleship-program/shared/articleship-tools.css">
<link rel="stylesheet" href="/articleship-program/shared/msc-tool.css">
<link rel="stylesheet" href="/articleship-program/written-test/written-test.css">
<link rel="icon" href="/articleship-program/shared/msc-symbol.svg" type="image/svg+xml">
</head>
<body class="ap-page ap-day-4 day-4" data-course="msc-articleship-program">
<a class="skip-link" href="#app">Skip to content</a>
<header class="ap-topbar msc-bar" id="bar">
  <a class="ap-brand logo" id="bar-logo" href="/learning-management-system/course?course=msc-articleship-program&amp;session=5" aria-label="Back to Day 4">
    <img class="logo-full" src="/articleship-program/shared/msc-logo.svg" alt="My Student Club" width="132" height="26">
    <img class="logo-mark" src="/articleship-program/shared/msc-symbol.svg" alt="My Student Club" width="22" height="26" hidden>
  </a>
  <span class="ap-topbar-title tool" id="bar-tool">Written test practice</span>
  <div class="right" id="bar-right"></div>
</header>
<main id="app" class="screen" tabindex="-1"><div class="wrap"><p class="loading">Loading…</p></div></main>
<div id="announce" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

<dialog id="confirm" class="msc-dialog" aria-labelledby="cf-title">
  <h2 id="cf-title">Submit the paper?</h2>
  <div class="cf-body"></div>
  <div class="dlg-actions">
    <button class="btn ghost cf-cancel" type="button">Keep going</button>
    <button class="btn accent cf-submit" type="button">Submit</button>
  </div>
</dialog>

<dialog id="nav-sheet" class="msc-dialog sheet" aria-labelledby="ns-title">
  <div class="ns-head">
    <h2 id="ns-title">Questions</h2>
    <button class="btn ghost small ns-close" type="button">Close</button>
  </div>
  <p class="ns-counts"></p>
  <ul class="nav-legend" aria-hidden="true">
    <li><span class="nq-dot answered"></span>Answered</li>
    <li><span class="nq-dot flagged"></span>Flagged</li>
    <li><span class="nq-dot"></span>Blank</li>
  </ul>
  <div class="nav-grid"></div>
</dialog>

<noscript><div class="wrap"><p>Turn on JavaScript to sit the papers.</p></div></noscript>
<script src="/scripts/supabase.js"></script>

<script src="/scripts/articleship-gate.js"></script>
<script src="/scripts/articleship-progress.js"></script>
<script src="/scripts/articleship-written-test.js"></script>
<script src="/articleship-program/written-test/js/written-test-core.js"></script>

</body>
</html>
