<!doctype html>
<html lang="en" class="ap-gated">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CV Recommender | My Student Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/articleship-program/shared/articleship-tools.css">
<link rel="stylesheet" href="/articleship-program/cv-recommender/cv-recommender.css">
<link rel="icon" href="/articleship-program/shared/msc-symbol.svg" type="image/svg+xml">
</head>
<body class="ap-page ap-day-1">
<header class="ap-topbar">
  <a class="ap-brand" href="/learning-management-system/course?course=msc-articleship-program&amp;session=2" aria-label="Back to the programme">
    <img src="/articleship-program/shared/msc-logo.svg" alt="My Student Club" width="132" height="26"></a>
  <span class="ap-topbar-title">CV Recommender</span>
</header>
<main class="ap-main cvr-main" id="main">
  <div class="ap-hero" id="hero">
    <h1 class="ap-title">Which CV <span class="ap-mark">order</span> is yours?</h1>
    <p class="ap-lede">Nine taps. You get your order, a design and the lines to add.</p>
  </div>
  <div id="app" class="cvr-app">
    <div class="cvr-loading" role="status"><span class="ap-spinner"></span></div>
  </div>
</main>
<script src="/scripts/supabase.js"></script>
<script src="/scripts/supabase-init.js"></script>
<script src="/scripts/articleship-gate.js"></script>
<script src="/scripts/articleship-progress.js"></script>
<script src="/scripts/articleship-lms.js"></script>
<script src="/scripts/articleship-cv-recommender.js"></script>
<script>
(function () {
    'use strict';
    var BASE = '/articleship-program/cv-recommender/';
    var app = document.getElementById('app');

    function getJson(path) {
        return fetch(BASE + path, { cache: 'no-cache' }).then(function (res) {
            if (!res.ok) throw new Error(path + ' ' + res.status);
            return res.json();
        });
    }

    function showRetry() {
        var card = document.createElement('div');
        card.className = 'ap-card cvr-error';
        var text = document.createElement('p');
        text.textContent = 'This did not load. Check your connection and try again.';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ap-btn';
        btn.textContent = 'Try again';
        btn.addEventListener('click', function () { location.reload(); });
        card.appendChild(text);
        card.appendChild(btn);
        app.replaceChildren(card);
    }

    function start() {
        Promise.all([getJson('situations.json'), getJson('designs.json').catch(function () { return { designs: [] }; })])
            .then(function (parts) {
                var data = parts[0];
                data.designs = parts[1];
                var store = MSCArticleshipProgress.open('cv-recommender', { defaults: { answers: null, step: 0, done: false } });
                MSCCvRecommender.mount(app, {
                    data: data,
                    store: store,
                    progress: MSCArticleshipProgress,
                    heroEl: document.getElementById('hero'),
                    mainEl: document.getElementById('main')
                });
            })
            .catch(showRetry);
    }

    MSCArticleshipGate.protect().then(start);
})();
</script>
</body>
</html>
